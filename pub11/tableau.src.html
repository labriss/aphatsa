<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diktéo · le tableau</title>
<style>
/*FONTS*/
html,body{margin:0;background:#050505;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#ui{position:absolute;left:0;bottom:0;width:100%;padding:10px;background:#111;color:#ccc;font:14px sans-serif;display:flex;gap:10px;align-items:center;box-sizing:border-box}
#ui input{flex:1}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="lecture">Lecture</button><input id="curseurUI" type="range" min="0" max="1000" value="0"><span id="temps">0.00</span></div>
<script>
/* Pub 11 « le tableau » : pour les électriciens. Chaque phrase dictée enclenche un disjoncteur ; l'interrupteur général
   allume toute la maison, et le devis part.
   144 BPM (1 temps = 0,417 s), 34 temps (14,2 s).
   b0   le néon « ÉLECTRICIEN ? » grésille et s'allume dans le noir    b3 le tableau sort de l'ombre
   b5…11 quatre phrases dictées : un disjoncteur claque à chacune, son prix s'imprime sur l'étiquette
   b14  l'interrupteur général : éclair, le compteur déroule le total
   b19  la caméra recule : c'est une maison, les fenêtres s'allument une à une
   b27  le devis part du toit comme un éclair                         b30.5 « Envoyé à M. Benali »   b34 carton */
const W=1080,H=1920,B=60/144,NB=34,DN=NB*B;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
function spring(t,w=14,z=.62){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const rnd=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const O1='#E8650F',O2='#C9480A',O3='#A8350A',ORANGE='#ff8a3d',ARC='#bfe3ff',CHAUD='#ffc98a';
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function texte(t,x,y,size,col,poids=700,font='Archivo',align='center'){g.font=`${poids} ${size}px ${font}`;g.fillStyle=col;g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y);}
function lueur(col,flou){g.shadowColor=col;g.shadowBlur=flou;}

// ——— le mur du local technique : béton sombre, grain ———
const BETON=(()=>{const c=document.createElement('canvas');c.width=1400;c.height=2200;const f=c.getContext('2d');
  f.fillStyle='#16130f';f.fillRect(0,0,1400,2200);
  const d=f.getImageData(0,0,1400,2200),p=d.data;let s=7;
  for(let i=0;i<p.length;i+=4){s=(s*16807)%2147483647;const n=(s/2147483647-.5)*16;p[i]+=n;p[i+1]+=n;p[i+2]+=n*.9;}
  f.putImageData(d,0,0);
  for(let i=0;i<260;i++){s=(s*16807)%2147483647;const x=s%1400;s=(s*16807)%2147483647;const y=s%2200;s=(s*16807)%2147483647;f.fillStyle=`rgba(0,0,0,${.15+(s%100)/400})`;f.beginPath();f.arc(x,y,1+(s%4),0,7);f.fill();}
  return c;})();

// ——— le monde : la pièce (le local du tableau) est au centre d'une grande maison ———
const PIECE={x:-60,y:-700,w:1200,h:2660};
const MAISON={x:-1000,y:-1400,w:3080,h:3800};
const FENETRES=[ // ordre d'allumage
  {x:-800,y:500,w:500,h:800},{x:1380,y:500,w:500,h:800},
  {x:-800,y:-1320,w:500,h:500},{x:290,y:-1320,w:500,h:500},{x:1380,y:-1320,w:500,h:500},
];
const TB={x:150,y:640,w:780,h:1040};          // le tableau électrique
const MOD_Y=TB.y+330, MOD_H=300;               // la rangée de modules
const GEN={x:TB.x+60,w:170};                   // l'interrupteur général (à gauche)
const MODS=[0,1,2,3].map(i=>({x:TB.x+256+i*118,w:108}));
const ITEMS=[
  {b:5, dit:'« Tableau 3 rangées,', dit2:'480 euros. »', prix:'480 €'},
  {b:7, dit:'« Douze prises,', dit2:'32 euros pièce. »', prix:'384 €'},
  {b:9, dit:'« Mise à la terre,', dit2:'150 euros. »', prix:'150 €'},
  {b:11,dit:'« Main-d’œuvre, 6 heures', dit2:'à 55 euros. »', prix:'330 €'},
];
const B_GEN=14, B_RECUL=16.6, B_ENV=21.8, B_TXT=23.4, B_FIN=26.2;
const TOTAL=1478.40;

// caméra : serrée sur le néon, puis le tableau, puis recul sur la maison entière
const camAt=b=>{
  const K=[[0,{x:540,y:420,z:1.06}],[2.4,{x:540,y:440,z:1.02}],[4.2,{x:540,y:1000,z:1}],[13,{x:540,y:1010,z:1.02}],[14,{x:540,y:1060,z:1.12}],
    [B_RECUL,{x:540,y:1010,z:1}],[B_RECUL+3,{x:540,y:350,z:.205}],[B_ENV+1,{x:540,y:200,z:.19}],[B_FIN,{x:540,y:-300,z:.17}]];
  if(b<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++)if(b<K[i][0]){const [b0,a]=K[i-1],[b1,c]=K[i],k=ease((b-b0)/(b1-b0));
    // le recul se fait en échelle logarithmique, sinon il paraît brutal à la fin
    return {x:lerp(a.x,c.x,k),y:lerp(a.y,c.y,k),z:Math.exp(lerp(Math.log(a.z),Math.log(c.z),k))};}
  return K[K.length-1][1];};

// un arc électrique entre deux points (éclair en zigzag, déterministe par image)
function eclair(x1,y1,x2,y2,seed,larg=3,amp=40,col=ARC){
  const n=10,pts=[[x1,y1]];const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
  for(let i=1;i<n;i++){const k=i/n,o=(rnd(seed+i*13)-.5)*amp*Math.sin(k*Math.PI)*2;pts.push([x1+dx*k+nx*o,y1+dy*k+ny*o]);}pts.push([x2,y2]);
  g.save();g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
  for(const [w,a,bl] of [[larg*5,.18,30],[larg*2,.5,14],[larg,1,6]]){g.strokeStyle=col;g.globalAlpha=a;g.lineWidth=w;lueur(col,bl);g.beginPath();g.moveTo(...pts[0]);for(const p of pts)g.lineTo(...p);g.stroke();}
  g.restore();}
function etincelles(x,y,seed,t,force=1,col=[200,230,255]){g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<22*force;i++){const a=rnd(seed+i*7)*Math.PI*2,v=(60+rnd(seed+i*3)*260)*force,age=t;
    if(age>1)break;const px=x+Math.cos(a)*v*age,py=y+Math.sin(a)*v*age+age*age*260;g.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${(1-age)})`;g.beginPath();g.arc(px,py,3.2*(1-age)+.8,0,7);g.fill();}
  g.restore();}

// une vis de borne
function vis(x,y,r=11){const gr=g.createRadialGradient(x-3,y-3,1,x,y,r);gr.addColorStop(0,'#f2f2f2');gr.addColorStop(1,'#8b8b8b');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.strokeStyle='#555';g.lineWidth=3;g.beginPath();g.moveTo(x-r*.6,y);g.lineTo(x+r*.6,y);g.stroke();}
// un module (disjoncteur) : corps blanc, bornes, manette ; on=0..1
function module(m,on,principal,lumiere){
  const {x,w}=m,y=MOD_Y,h=MOD_H;
  const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#a9a59d');gr.addColorStop(.25,'#cdc9c1');gr.addColorStop(.8,'#bbb7af');gr.addColorStop(1,'#96928a');
  g.fillStyle=gr;rr(x,y,w,h,8);g.fill();
  g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x+6,y+h*.32,w-12,2);g.fillRect(x+6,y+h*.68,w-12,2);
  vis(x+w/2,y+28);vis(x+w/2,y+h-28);
  // fenêtre de la manette
  const fx=x+w/2-(principal?44:30),fw=principal?88:60,fy=y+h*.36,fh=h*.28;
  g.fillStyle='#2a2826';rr(fx,fy,fw,fh,8);g.fill();
  // la manette : en bas = coupé, en haut = enclenché
  const my=lerp(fy+fh-30,fy-24,on),mh=54;
  g.save();lueur('rgba(0,0,0,.6)',10);
  const gm=g.createLinearGradient(fx,0,fx+fw,0);
  if(principal){gm.addColorStop(0,'#8e1d10');gm.addColorStop(.4,'#e5432a');gm.addColorStop(1,'#9b2412');}else{gm.addColorStop(0,'#1d4f8f');gm.addColorStop(.4,'#3f8ae0');gm.addColorStop(1,'#1d4f8f');}
  g.fillStyle=gm;rr(fx+6,my,fw-12,mh,10);g.fill();g.restore();
  g.fillStyle='rgba(255,255,255,.35)';rr(fx+12,my+6,fw-24,8,4);g.fill();
  // témoin : rouge « 0 », vert « I »
  const tx=x+w/2,ty=y+h*.74;
  g.fillStyle=on>.5?'#2fbf62':'#a22';g.beginPath();g.arc(tx,ty+20,9,0,7);g.fill();
  if(on>.5&&lumiere){g.save();g.globalCompositeOperation='lighter';const gl=g.createRadialGradient(tx,ty+20,0,tx,ty+20,40);gl.addColorStop(0,'rgba(80,255,140,.6)');gl.addColorStop(1,'rgba(80,255,140,0)');g.fillStyle=gl;g.beginPath();g.arc(tx,ty+20,40,0,7);g.fill();g.restore();}
  texte(principal?'GÉNÉRAL':(on>.5?'I':'0'),tx,y+h*.28,principal?20:24,'#5a5650',800,'Archivo');
}
// le tableau entier
function tableau(b,t){
  const {x,y,w,h}=TB;
  // ombre portée sur le mur
  g.save();g.fillStyle='rgba(0,0,0,.55)';lueur('rgba(0,0,0,.8)',60);rr(x+14,y+26,w,h,26);g.fill();g.restore();
  // coffret
  const gc=g.createLinearGradient(x,y,x+w,y+h);gc.addColorStop(0,'#b9b3a8');gc.addColorStop(.6,'#a39d92');gc.addColorStop(1,'#868075');g.fillStyle=gc;rr(x,y,w,h,26);g.fill();
  g.fillStyle='#8e887e';rr(x+30,y+200,w-60,h-260,16);g.fill();
  g.fillStyle='rgba(0,0,0,.12)';rr(x+30,y+200,w-60,8,4);g.fill();
  // le rail
  const gr=g.createLinearGradient(0,MOD_Y+120,0,MOD_Y+180);gr.addColorStop(0,'#9ea3a8');gr.addColorStop(.5,'#e3e6e9');gr.addColorStop(1,'#8a8f94');g.fillStyle=gr;g.fillRect(x+40,MOD_Y+120,w-80,60);
  // le compteur, en haut du coffret : écran LCD
  const lx=x+60,ly=y+50,lw=w-120,lh=110;
  g.fillStyle='#0b0d0c';rr(lx,ly,lw,lh,14);g.fill();
  const kg=easeOut(seg(b,B_GEN+.3,B_GEN+2.3)),val=TOTAL*kg,allume=b>=B_GEN+.2;
  if(allume){const txt=val.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/ | /g,' ')+' €';
    const fl=Math.exp(-Math.max(0,b-(B_GEN+2.3))*B*3)*(kg>=1?1:0);
    g.save();g.globalAlpha=clamp((b-B_GEN-.2)*4);lueur(`rgba(255,138,61,${.7+.3*fl})`,20+50*fl);texte(txt,lx+lw-30,ly+lh/2+4,66,ORANGE,800,'JBMono','right');g.restore();
    texte('TOTAL TTC',lx+26,ly+lh/2,24,'rgba(255,170,110,.75)',700,'Archivo','left');}
  else{g.fillStyle='rgba(255,255,255,.05)';texte('— — —',lx+lw-30,ly+lh/2,50,'rgba(255,255,255,.08)',800,'JBMono','right');}
  // les câbles qui partent du haut de chaque module vers le haut du coffret
  const tous=b>=B_GEN+.2;
  MODS.forEach((m,i)=>{const it=ITEMS[i],on=b>=it.b+.35;const cx=m.x+m.w/2,col=['#c0392b','#2c6fd6','#e3b21b','#33a35a'][i];
    g.save();g.strokeStyle=col;g.lineWidth=10;g.lineCap='round';g.beginPath();g.moveTo(cx,MOD_Y);g.bezierCurveTo(cx,MOD_Y-60,cx,y+230,cx-10*i,y+200);g.stroke();
    if(on){// le courant qui court dans le câble
      g.globalCompositeOperation='lighter';g.setLineDash([22,46]);g.lineDashOffset=-(t*260)%68;g.strokeStyle=tous?'rgba(255,230,180,.95)':'rgba(255,220,160,.7)';g.lineWidth=5;lueur('rgba(255,200,120,.9)',14);
      g.beginPath();g.moveTo(cx,MOD_Y);g.bezierCurveTo(cx,MOD_Y-60,cx,y+230,cx-10*i,y+200);g.stroke();}
    g.restore();});
  // modules
  module(GEN,ease(seg(b,B_GEN,B_GEN+.35)),true,tous);
  MODS.forEach((m,i)=>module(m,ease(seg(b,ITEMS[i].b+.1,ITEMS[i].b+.4)),false,true));
  // les étiquettes sous les modules : le prix s'y imprime
  const ey=MOD_Y+MOD_H+40;
  g.fillStyle='#d3cec3';rr(x+36,ey,w-72,96,10);g.fill();g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=2;rr(x+36,ey,w-72,96,10);g.stroke();
  texte('ARRIVÉE',GEN.x+GEN.w/2,ey+48,22,'#6c675f',800,'Archivo');
  MODS.forEach((m,i)=>{const it=ITEMS[i];if(b<it.b+.5)return;const k=spring((b-it.b-.5)*B,16,.6),fl=Math.exp(-(b-it.b-.5)*B*5);
    g.save();g.translate(m.x+m.w/2,ey+48);g.scale(lerp(1.6,1,clamp(k)),lerp(1.6,1,clamp(k)));g.globalAlpha*=clamp(k*2);lueur(`rgba(232,101,15,${.5*fl})`,30*fl);
    texte(it.prix,0,0,30,O3,800,'JBMono');g.restore();});
  // plaque « Tableau » + le logo sous les étiquettes
  texte('LOGEMENT M. BENALI',x+w/2,y+h-60,24,'#77726a',800,'Archivo');
}

// ——— la maison, vue de l'extérieur la nuit ———
const CIEL=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const f=c.getContext('2d');
  const gr=f.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#030712');gr.addColorStop(.6,'#0b1730');gr.addColorStop(1,'#16223a');f.fillStyle=gr;f.fillRect(0,0,W,H);
  for(let i=0;i<220;i++){const x=rnd(i*3.1)*W,y=rnd(i*5.7)*H*.8,r=rnd(i*9.3)*1.6+.3;f.fillStyle=`rgba(255,255,255,${.25+rnd(i*1.7)*.6})`;f.beginPath();f.arc(x,y,r,0,7);f.fill();}
  return c;})();
function fenetre(f,a,t,i){
  const {x,y,w,h}=f;
  g.fillStyle='#07090d';g.fillRect(x,y,w,h);
  if(a>0){const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,`rgba(232,180,120,${.85*a})`);gr.addColorStop(1,`rgba(200,120,60,${.85*a})`);g.fillStyle=gr;g.fillRect(x,y,w,h);
    // une silhouette de lampe au plafond
    g.fillStyle=`rgba(120,60,20,${.6*a})`;g.fillRect(x+w/2-4,y,8,h*.18);g.beginPath();g.moveTo(x+w/2-60,y+h*.18+50);g.lineTo(x+w/2+60,y+h*.18+50);g.lineTo(x+w/2+24,y+h*.18);g.lineTo(x+w/2-24,y+h*.18);g.fill();
    g.save();g.globalCompositeOperation='lighter';const gl=g.createRadialGradient(x+w/2,y+h/2,0,x+w/2,y+h/2,w*1.4);gl.addColorStop(0,`rgba(255,170,90,${.35*a})`);gl.addColorStop(1,'rgba(255,140,60,0)');g.fillStyle=gl;g.fillRect(x-w,y-h*.6,w*3,h*2.2);g.restore();}
  g.strokeStyle='#2b2a28';g.lineWidth=26;g.strokeRect(x,y,w,h);g.lineWidth=16;g.beginPath();g.moveTo(x+w/2,y);g.lineTo(x+w/2,y+h);g.moveTo(x,y+h*.45);g.lineTo(x+w,y+h*.45);g.stroke();
}
function maison(b,t,allume){
  const {x,y,w,h}=MAISON;
  // le toit
  g.fillStyle='#1d1b1a';g.beginPath();g.moveTo(x-180,y+40);g.lineTo(x+w/2,y-1150);g.lineTo(x+w+180,y+40);g.closePath();g.fill();
  g.strokeStyle='#2c2927';g.lineWidth=40;g.stroke();
  // cheminée
  g.fillStyle='#24211f';g.fillRect(x+w*.72,y-900,260,700);
  // la façade
  const gf=g.createLinearGradient(0,y,0,y+h);gf.addColorStop(0,'#2a2724');gf.addColorStop(1,'#1c1a18');g.fillStyle=gf;g.fillRect(x,y,w,h);
  // l'enduit : quelques lignes
  g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=8;for(let yy=y+300;yy<y+h;yy+=300){g.beginPath();g.moveTo(x,yy);g.lineTo(x+w,yy);g.stroke();}
  FENETRES.forEach((f,i)=>fenetre(f,allume[i],t,i));
  // le sol
  g.fillStyle='#0c0c0b';g.fillRect(x-6000,y+h,w+12000,9000);
}

function seek(T){
  const t=((T%DN)+DN)%DN,b=t/B;
  g.setTransform(1,0,0,1,0,0);
  const cam=camAt(b);
  g.drawImage(CIEL,0,0);
  g.save();g.translate(540,960);g.scale(cam.z,cam.z);g.translate(-cam.x,-cam.y);
  // la maison autour (visible au recul) ; les fenêtres s'allument une à une
  const allume=FENETRES.map((f,i)=>{const b0=B_RECUL+1.4+i*.6;const k=seg(b,b0,b0+.25);return b>=b0?clamp(k+(rnd(i+Math.floor(t*30))<.3&&k<1?-.5:0)):0;});
  maison(b,t,allume);
  // la pièce du tableau : le mur de béton, éclairé par le néon puis par le tableau
  g.save();g.beginPath();g.rect(PIECE.x,PIECE.y,PIECE.w,PIECE.h);g.clip();
  g.drawImage(BETON,PIECE.x-100,PIECE.y-100);
  // le néon : grésille au début, puis tient
  const flick=b<1.6?(rnd(Math.floor(t*24))>.45-b*.25?1:.15):1;
  const neonA=(b<.15?0:flick)*Math.max(1-seg(b,3.8,4.6),.75*seg(b,B_RECUL+.5,B_RECUL+2));
  // la lumière du néon sur le mur
  if(neonA>0){const gl=g.createRadialGradient(540,330,40,540,480,900);gl.addColorStop(0,`rgba(255,150,70,${.45*neonA})`);gl.addColorStop(1,'rgba(255,120,40,0)');g.fillStyle=gl;g.fillRect(PIECE.x,PIECE.y,PIECE.w,PIECE.h);}
  // la lumière du tableau quand tout est enclenché
  const kg=seg(b,B_GEN+.2,B_GEN+1.5);
  {const base=.12+.5*seg(b,2.8,4.4);const gl=g.createRadialGradient(540,1150,100,540,1150,1100);gl.addColorStop(0,`rgba(255,225,190,${.6*base*(.5+.5*kg)})`);gl.addColorStop(1,'rgba(255,220,180,0)');g.fillStyle=gl;g.fillRect(PIECE.x,PIECE.y,PIECE.w,PIECE.h);}
  // le tableau sort de l'ombre
  g.save();g.globalAlpha=seg(b,2.6,4.2);tableau(b,t);g.restore();
  // l'ombre sur les bords de la pièce
  const vg=g.createRadialGradient(540,1000,500,540,1000,1350);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.75)');g.fillStyle=vg;g.fillRect(PIECE.x,PIECE.y,PIECE.w,PIECE.h);
  // le néon lui-même : tube orange, cœur blanc
  if(neonA>0){g.save();g.font='900 100px Archivo';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.globalAlpha=neonA;
    g.globalCompositeOperation='lighter';
    for(const [lw,col,bl] of [[26,'rgba(255,100,30,.35)',60],[14,'rgba(255,130,50,.9)',30],[5,'rgba(255,240,220,1)',8]]){g.strokeStyle=col;g.lineWidth=lw;lueur('rgba(255,110,40,1)',bl);g.strokeText('ÉLECTRICIEN ?',540,330);}
    g.restore();}
  // la phrase de contexte, sous le néon
  if(b>1&&b<4.6){const k=spring((b-1)*B,15,.7);g.save();g.globalAlpha=clamp(k*1.6)*(1-seg(b,3.8,4.6));g.translate(0,(1-clamp(k))*16);lueur('rgba(0,0,0,.9)',20);texte('Encore un devis à taper ce soir ?',540,470,52,'#f3e6d6',800,'Archivo');g.restore();}
  // les claquements : éclair + étincelles à chaque disjoncteur

    g.restore();}
  g.restore(); // fin de la caméra

  // l'éclair blanc de l'interrupteur général (plein écran)
  {const d=(b-(B_GEN+.2))*B;if(d>=0&&d<.5){g.save();g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,230,200,${.3*(1-d/.5)})`;g.fillRect(0,0,W,H);g.restore();}}

  ITEMS.forEach((it,i)=>{const b1=i<3?ITEMS[i+1].b-.15:B_GEN-.4;if(b<it.b-.05||b>b1+.2)return;

    texte('Le devis dicté devant le tableau.',540,940,46,'#e8ddd0',600,'Archivo');
    texte('3 devis offerts par mois · sans carte',540,1060,44,'#fff',700,'Archivo');
    const gb=g.createLinearGradient(290,1150,790,1250);gb.addColorStop(0,O1);gb.addColorStop(.55,O2);gb.addColorStop(1,O3);g.fillStyle=gb;rr(270,1150,540,104,34);g.fill();
