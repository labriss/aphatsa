<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fuitéo — titres de la pub</title>
<!-- Les titres et l'écran de fin de la pub, en couches transparentes posées sur les plans 3D.
     Tout est une fonction du temps : window.rendre(t) dessine l'image à l'instant t (en secondes).
     Couleurs et polices de la charte (src/app/globals.css, mode sombre). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800;100,900&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --background: #0E1412;
    --foreground: #E7EDEA;
    --muted-foreground: #98A6A0;
    --primary: #FF7A33;
    --primary-foreground: #1A0D05;
    --primary-gradient: linear-gradient(135deg, #FFA15C 0%, #FF7A33 50%, #F25C14 100%);
    --froid: #BFD0E4;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body.fond { background: var(--background); }
  * { box-sizing: border-box; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .titre {
    position: absolute; left: 90px; right: 90px;
    font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 100%;
    font-size: 104px; line-height: 0.98; letter-spacing: -0.035em; color: var(--foreground);
    text-shadow: 0 4px 40px rgb(0 0 0 / 0.55);
  }
  .ligne { display: block; overflow: hidden; padding-bottom: 0.08em; }
  .ligne > span { display: inline-block; will-change: transform; }
  .orange { color: var(--primary); }
  .froid { color: var(--froid); }
  .centre { text-align: center; }

  /* Défilé des métiers : le nom en très grand, qui claque sur chaque temps. */
  #metier { top: 250px; font-size: 150px; text-align: center; }
  #metiers-sous { position: absolute; left: 0; right: 0; top: 1500px; text-align: center;
    font-family: "Public Sans", sans-serif; font-weight: 700; font-size: 46px; color: var(--foreground); }

  /* Écran de fin. */
  #fin { background: var(--background); }
  #fin .halo { position: absolute; left: 50%; top: 46%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(242 92 20 / 0.55), rgb(242 92 20 / 0.18) 55%, transparent); filter: blur(10px); }
  #marque { position: absolute; left: 0; right: 0; top: 640px; display: flex; align-items: center; justify-content: center; gap: 26px; }
  #marque svg { width: 150px; height: 150px; color: var(--primary); }
  #marque span { font-family: "Archivo", sans-serif; font-weight: 900; font-size: 190px; letter-spacing: -0.04em; color: var(--foreground); line-height: 1; }
  #promesse { text-shadow: none; top: 900px; font-size: 76px; text-align: center; line-height: 1.04; }
  #cta { position: absolute; left: 50%; top: 1170px; transform: translateX(-50%); height: 128px; padding: 0 64px; border-radius: 999px;
    display: flex; align-items: center; background: var(--primary-gradient); color: var(--primary-foreground);
    font-family: "Public Sans", sans-serif; font-weight: 700; font-size: 50px; white-space: nowrap; box-shadow: 0 20px 80px rgb(242 92 20 / 0.45); }
  #url { position: absolute; left: 0; right: 0; top: 1345px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 42px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <!-- Plan 1 : l'accroche, sous la goutte. -->
  <div class="scene" id="s1"><div class="titre" style="top: 1130px; left: 64px; right: 40px; font-size: 86px"><span class="ligne"><span>Vous réparez la fuite</span></span><span class="ligne"><span>en 20 minutes.</span></span></div></div>
  <!-- Plan 2 : la chute, entre l'horloge et l'ordinateur. -->
  <div class="scene" id="s2"><div class="titre" style="top: 745px; left: 64px; right: 40px; font-size: 86px"><span class="ligne"><span>Le devis, lui,</span></span><span class="ligne"><span>vous prend <span class="froid">la soirée.</span></span></span></div></div>
  <!-- Plan 4 : la bascule. -->
  <div class="scene" id="s4"><div class="titre centre" style="top: 820px; font-size: 128px"><span class="ligne"><span>Et si vous</span></span><span class="ligne"><span>le <span class="orange">dictiez&nbsp;?</span></span></span></div></div>
  <!-- Plan 6 : le drop, au-dessus du téléphone. -->
  <div class="scene" id="s6"><div class="titre centre" style="top: 64px; font-size: 100px"><span class="ligne"><span>Chiffré</span></span><span class="ligne"><span class="orange">tout seul.</span></span></div></div>
  <!-- Plan 8 : tous les métiers. -->
  <div class="scene" id="s8"><div class="titre" id="metier"><span class="ligne"><span id="metier-nom">Électricien</span></span></div><p id="metiers-sous">Pour tous les métiers du bâtiment.</p></div>
  <!-- Plan 10 : la fin. -->
  <div class="scene" id="fin">
    <div class="halo"></div>
    <div id="marque">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-3.6 4.4-7 8.6-7 12.2A7 7 0 0 0 19 14.7c0-3.6-3.4-7.8-7-12.2Z" fill="currentColor"/></svg>
      <span>Fuitéo</span>
    </div>
    <div class="titre" id="promesse"><span class="ligne"><span>Le devis dicté,</span></span><span class="ligne"><span>envoyé du chantier.</span></span></div>
    <div id="cta">Gratuit pour commencer</div>
    <div id="url">fuiteo.vercel.app</div>
  </div>

<script>
  // Courbes d'animation.
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lin = (t, a, b) => clamp((t - a) / (b - a));
  const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
  const outBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

  // Une scène de titres : les lignes montent de sous leur cache, l'une après l'autre, puis tout s'efface.
  function titres(id, t, debut, fin, { decalage = 0.12, duree = 0.55, sortie = 0.3 } = {}) {
    const el = document.getElementById(id);
    const visible = t >= debut - 0.01 && t <= fin + sortie;
    el.style.opacity = visible ? 1 - inOut(lin(t, fin, fin + sortie)) : 0;
    if (!visible) return;
    el.querySelectorAll(".ligne > span").forEach((span, i) => {
      const x = outExpo(lin(t, debut + i * decalage, debut + i * decalage + duree));
      span.style.transform = `translateY(${(1 - x) * 110}%)`;
    });
    const titre = el.querySelector(".titre");
    titre.style.filter = `blur(${inOut(lin(t, fin, fin + sortie)) * 14}px)`;
  }

  const METIERS = ["Électricien", "Chauffagiste", "Carreleur", "Peintre", "Menuisier", "Maçon", "Couvreur", "Serrurier", "Multiservice"];
  const M0 = 19.5, MPAS = 0.5;

  window.rendre = function (t) {
    titres("s1", t, 0.5, 2.25);
    titres("s2", t, 2.75, 4.75);
    titres("s4", t, 7.0, 7.85, { decalage: 0.08, duree: 0.4, sortie: 0.2 });
    titres("s6", t, 13.05, 16.2, { decalage: 0.1, duree: 0.45 });

    // Plan 8 : un métier par temps ; le nom claque (léger rebond), la phrase reste en dessous.
    const s8 = document.getElementById("s8");
    const k = Math.floor((t - M0) / MPAS);
    s8.style.opacity = t >= M0 && t < M0 + METIERS.length * MPAS ? 1 : 0;
    if (k >= 0 && k < METIERS.length) {
      document.getElementById("metier-nom").textContent = METIERS[k];
      const x = lin(t, M0 + k * MPAS, M0 + k * MPAS + 0.18);
      const nom = document.getElementById("metier-nom");
      nom.style.transform = `translateY(${(1 - outExpo(x)) * 100}%) scale(${0.9 + 0.1 * outBack(x)})`;
      document.getElementById("metiers-sous").style.opacity = outExpo(lin(t, M0, M0 + 0.4));
    }

    // Plan 10 : la goutte tombe et se pose, le nom glisse, la promesse monte, puis le bouton et l'adresse.
    const F = 26.5;
    const fin = document.getElementById("fin");
    fin.style.opacity = outExpo(lin(t, F, F + 0.35));
    const drop = outBack(lin(t, F + 0.1, F + 0.65));
    document.querySelector("#marque svg").style.transform = `translateY(${(1 - drop) * -260}px) scale(${0.6 + 0.4 * drop})`;
    const nom = outExpo(lin(t, F + 0.35, F + 0.95));
    const mot = document.querySelector("#marque span");
    mot.style.transform = `translateX(${(1 - nom) * 60}px)`;
    mot.style.opacity = nom;
    document.querySelectorAll("#promesse .ligne > span").forEach((span, i) => {
      const x = outExpo(lin(t, F + 0.75 + i * 0.12, F + 1.35 + i * 0.12));
      span.style.transform = `translateY(${(1 - x) * 110}%)`;
    });
    const cta = outBack(lin(t, F + 1.35, F + 1.8));
    const bouton = document.getElementById("cta");
    bouton.style.transform = `translateX(-50%) scale(${0.7 + 0.3 * cta})`;
    bouton.style.opacity = clamp(cta * 1.5);
    document.getElementById("url").style.opacity = outExpo(lin(t, F + 1.7, F + 2.2));
    const halo = document.querySelector("#fin .halo");
    halo.style.transform = `scale(${0.75 + 0.25 * outExpo(lin(t, F, F + 2.5)) + 0.02 * Math.sin(t * 2.2)})`;
  };

  const p = new URLSearchParams(location.search);
  if (p.get("fond") === "1") document.body.classList.add("fond");
  window.rendre(Number(p.get("t") ?? 0));
</script>
</body>
</html>
