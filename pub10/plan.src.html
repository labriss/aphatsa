<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diktéo · le plan devient le devis</title>
<style>
/*FONTS*/
html,body{margin:0;background:#050505;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#ui{position:absolute;left:0;bottom:0;width:100%;padding:10px;background:#111;color:#ccc;font:14px sans-serif;display:flex;gap:10px;align-items:center;box-sizing:border-box}
#ui input{flex:1}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="lecture">Lecture</button><input id="curseurUI" type="range" min="0" max="1000" value="0"><span id="temps">0.00</span></div>
<script>
/* Pub 10 « le plan devient le devis » : un plan de plombier qui se dessine tout seul pendant qu'on dicte.
   125 BPM (1 temps = 0,48 s), 34 temps (16,3 s).
   b0   le cartouche : « PLOMBIER ? »             b2.5  la caméra recule, la salle de bain se trace
   b5…11 quatre phrases dictées, un élément par phrase, son prix s'allume au bout d'une cote
   b13  le total frappe dans le cartouche        b14.4 le plan bascule : la pièce et chaque travail se lèvent en 3D
   b21.6 tout se replie, le plan devient un avion b24 « Envoyé à Mme Fontaine »   b26.5 carton */
const W=1080,H=1920,B=60/125,NB=34,DN=NB*B;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
function spring(t,w=14,z=.62){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const rnd=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const TRAIT='#d6ecff',BLEU='#7fb8ff',O1='#E8650F',O2='#C9480A',O3='#A8350A',ORANGE='#ff8a3d';
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function texte(t,x,y,size,col,poids=700,font='Archivo',align='center'){g.font=`${poids} ${size}px ${font}`;g.fillStyle=col;g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y);}
function lueur(col,flou){g.shadowColor=col;g.shadowBlur=flou;}

// ——— le papier bleu du plan : dégradé profond, quadrillage fin et gros, grain ———
const FOND=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const f=c.getContext('2d');
  const gr=f.createRadialGradient(540,800,100,540,900,1400);gr.addColorStop(0,'#0f3158');gr.addColorStop(1,'#04101f');f.fillStyle=gr;f.fillRect(0,0,W,H);
  const d=f.getImageData(0,0,W,H),p=d.data;let s=5;for(let i=0;i<p.length;i+=4){s=(s*16807)%2147483647;const n=(s/2147483647-.5)*7;p[i]+=n;p[i+1]+=n;p[i+2]+=n;}f.putImageData(d,0,0);return c;})();
function quadrillage(z){
  g.save();g.lineWidth=1/z;
  for(const [pas,a] of [[40,.06],[200,.13]]){g.strokeStyle=`rgba(150,200,255,${a})`;g.beginPath();
    for(let x=-1000;x<=2080;x+=pas){g.moveTo(x,-1000);g.lineTo(x,3000);}for(let y=-1000;y<=3000;y+=pas){g.moveTo(-1000,y);g.lineTo(2080,y);}g.stroke();}
  g.restore();
}

// ——— un trait qui se dessine : renvoie la pointe, pour y faire jaillir des étincelles ———
function trace(pts,u,larg=3,col=TRAIT,ferme=false){
  const segs=[];let L=0;const P=ferme?[...pts,pts[0]]:pts;
  for(let i=1;i<P.length;i++){const l=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);segs.push([P[i-1],P[i],l]);L+=l;}
  let reste=L*clamp(u),pointe=P[0];
  g.save();g.strokeStyle=col;g.lineWidth=larg;g.lineCap='round';g.lineJoin='round';lueur('rgba(140,200,255,.7)',12);g.beginPath();g.moveTo(P[0][0],P[0][1]);
  for(const [a,b,l] of segs){if(reste<=0)break;const k=Math.min(1,reste/l);pointe=[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];g.lineTo(pointe[0],pointe[1]);reste-=l;}
  g.stroke();g.restore();
  return u>0&&u<1?pointe:null;
}
function arc(cx,cy,r,a0,a1,u,larg=3){g.save();g.strokeStyle=TRAIT;g.lineWidth=larg;lueur('rgba(140,200,255,.7)',12);g.beginPath();g.arc(cx,cy,r,a0,lerp(a0,a1,clamp(u)));g.stroke();g.restore();
  const a=lerp(a0,a1,clamp(u));return u>0&&u<1?[cx+Math.cos(a)*r,cy+Math.sin(a)*r]:null;}
// étincelles à la pointe du crayon (déterministes)
function etincelles(p,seed,t,force=1){if(!p)return;g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<14*force;i++){const a=rnd(seed+i*7+Math.floor(t*30))*Math.PI*2,v=20+rnd(seed+i*3+Math.floor(t*30))*90*force,age=rnd(seed+i*11+Math.floor(t*30));
    const x=p[0]+Math.cos(a)*v*age,y=p[1]+Math.sin(a)*v*age+age*age*40;g.fillStyle=`rgba(255,${180+rnd(i)*60|0},120,${(1-age)*.9})`;g.beginPath();g.arc(x,y,2.6*(1-age)+.8,0,7);g.fill();}
  const gr=g.createRadialGradient(p[0],p[1],0,p[0],p[1],34);gr.addColorStop(0,'rgba(255,240,210,.95)');gr.addColorStop(.3,'rgba(255,170,90,.5)');gr.addColorStop(1,'rgba(255,120,40,0)');g.fillStyle=gr;g.beginPath();g.arc(p[0],p[1],34,0,7);g.fill();
  g.restore();}

// ——— la salle de bain (coordonnées du plan) ———
const PIECE=[[140,430],[940,430],[940,1300],[140,1300]];
const CART={x:140,y:1440,w:800,h:300};
const ITEMS=[
  {b:5, dit:'« Chauffe-eau 200 litres,', prix:'520 €', dit2:'520 euros. »', dessin:'ballon', at:[300,600], lab:[560,560]},
  {b:7, dit:'« Groupe de sécurité,', prix:'48 €', dit2:'48 euros. »', dessin:'vanne', at:[300,800], lab:[560,800]},
  {b:9, dit:'« Dépose de l’ancien ballon,', prix:'60 €', dit2:'60 euros. »', dessin:'depose', at:[720,1000], lab:[430,1000]},
  {b:11,dit:'« Main-d’œuvre, 3 heures', prix:'165 €', dit2:'à 55 euros. »', dessin:'horloge', at:[380,1180], lab:[600,1180]},
];
const B_TOT=13, B_3D=14.4, B_PLIE=21.6, B_ENV=24, B_FIN=26.5;
const M3=[15.6,17.1,18.6,20.1];   // chaque travail se lève en 3D, un toutes les 0,72 s
// caméra : très près du cartouche, recul sur la pièce, retour au cartouche pour le total, puis vue 3D qui tourne
const camAt=b=>{
  const K=[[0,{x:540,y:1590,z:1.25}],[2.2,{x:540,y:1590,z:1.25}],[4.2,{x:540,y:1030,z:.95}],[12.6,{x:540,y:1000,z:1}],[13.6,{x:720,y:1620,z:1.3}],[14.4,{x:720,y:1620,z:1.3}],[15.9,{x:500,y:1000,z:1.12}],[B_PLIE,{x:430,y:1000,z:1.0}]];
  if(b<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++)if(b<K[i][0]){const [b0,a]=K[i-1],[b1,c]=K[i],k=ease((b-b0)/(b1-b0));return {x:lerp(a.x,c.x,k),y:lerp(a.y,c.y,k),z:lerp(a.z,c.z,k)};}
  return K[K.length-1][1];};

// ——— la projection : le plan bascule (ph) et tourne (th) ; tout ce qui est en 3D passe par P(x,y,z) ———
let V;
function P(x,y,z=0){const dx=x-V.cx,dy=y-V.cy,c=Math.cos(V.th),s=Math.sin(V.th);const xr=dx*c-dy*s,yr=dx*s+dy*c;return [540+V.s*xr,V.Y0+V.s*(yr*Math.cos(V.ph)-z*Math.sin(V.ph))];}
function prof(x,y){const dx=x-V.cx,dy=y-V.cy;return dx*Math.sin(V.th)+dy*Math.cos(V.th);}
function sol(){const c=Math.cos(V.th),s=Math.sin(V.th),cp=Math.cos(V.ph),a=V.s*c,bb=V.s*cp*s,cc=-V.s*s,d=V.s*cp*c;g.transform(a,bb,cc,d,540-a*V.cx-cc*V.cy,V.Y0-bb*V.cx-d*V.cy);}
// un cylindre plein, éclairé de côté (le ballon, la vanne, les raccords)
function cylindre(x,y,r,z0,h,cols,trait=1){
  const [bx,by]=P(x,y,z0),[tx,ty]=P(x,y,z0+h),rx=V.s*r,ry=V.s*r*Math.cos(V.ph);
  const gr=g.createLinearGradient(bx-rx,0,bx+rx,0);gr.addColorStop(0,cols[0]);gr.addColorStop(.3,cols[1]);gr.addColorStop(.72,cols[2]);gr.addColorStop(1,cols[0]);
  g.beginPath();g.moveTo(tx+rx,ty);g.lineTo(bx+rx,by);g.ellipse(bx,by,rx,ry,0,0,Math.PI);g.lineTo(tx-rx,ty);g.ellipse(tx,ty,rx,ry,0,Math.PI,Math.PI*2);g.closePath();g.fillStyle=gr;g.fill();
  const gt=g.createLinearGradient(tx-rx,ty-ry,tx+rx,ty+ry);gt.addColorStop(0,cols[3]);gt.addColorStop(1,cols[2]);g.fillStyle=gt;g.beginPath();g.ellipse(tx,ty,rx,ry,0,0,7);g.fill();
  if(trait>0){g.save();g.globalAlpha*=trait;g.strokeStyle=TRAIT;g.lineWidth=2;lueur('rgba(140,200,255,.8)',10);g.beginPath();g.ellipse(tx,ty,rx,ry,0,0,7);g.moveTo(tx+rx,ty);g.lineTo(bx+rx,by);g.ellipse(bx,by,rx,ry,0,0,Math.PI);g.lineTo(tx-rx,ty);g.stroke();g.restore();}
  return {bx,by,tx,ty,rx,ry};
}
// un cylindre en pointillés (l'ancien ballon, qu'on enlève)
function fantome(x,y,r,z0,h,col){
  const [bx,by]=P(x,y,z0),[tx,ty]=P(x,y,z0+h),rx=V.s*r,ry=V.s*r*Math.cos(V.ph);
  g.save();g.strokeStyle=col;g.lineWidth=3;g.setLineDash([14,10]);lueur(col,16);g.fillStyle='rgba(255,138,61,.08)';
  g.beginPath();g.moveTo(tx+rx,ty);g.lineTo(bx+rx,by);g.ellipse(bx,by,rx,ry,0,0,Math.PI);g.lineTo(tx-rx,ty);g.ellipse(tx,ty,rx,ry,0,Math.PI,Math.PI*2);g.fill();
  g.beginPath();g.ellipse(tx,ty,rx,ry,0,0,7);g.moveTo(tx+rx,ty);g.lineTo(bx+rx,by);g.moveTo(tx-rx,ty);g.lineTo(bx-rx,by);g.moveTo(bx+rx,by);g.ellipse(bx,by,rx,ry,0,0,Math.PI);g.stroke();g.restore();
}
// un mur qui monte, en verre bleu
function mur(p1,p2,h){if(h<1)return;const a=P(p1[0],p1[1],0),b=P(p2[0],p2[1],0),c=P(p2[0],p2[1],h),d=P(p1[0],p1[1],h);
  g.save();g.beginPath();g.moveTo(...a);g.lineTo(...b);g.lineTo(...c);g.lineTo(...d);g.closePath();
  const gr=g.createLinearGradient(0,Math.max(a[1],b[1]),0,Math.min(c[1],d[1]));gr.addColorStop(0,'rgba(127,184,255,.26)');gr.addColorStop(1,'rgba(127,184,255,.05)');g.fillStyle=gr;g.fill();
  g.strokeStyle=TRAIT;g.lineWidth=2.5;lueur('rgba(140,200,255,.8)',12);g.beginPath();g.moveTo(...a);g.lineTo(...d);g.lineTo(...c);g.lineTo(...b);g.stroke();g.restore();}
// un tuyau de cuivre en 3D (trois passes : ombre, cuivre, reflet)
function tuyau(pts,larg,u=1){const Q=pts.map(p=>P(...p));let L=0;const ls=[];for(let i=1;i<Q.length;i++){const l=Math.hypot(Q[i][0]-Q[i-1][0],Q[i][1]-Q[i-1][1]);ls.push(l);L+=l;}
  g.save();g.lineCap='round';g.lineJoin='round';
  for(const [w,col,dy] of [[larg,'#5a260a',0],[larg*.66,'#c8723a',0],[larg*.2,'#ffd3a8',-larg*.15]]){let reste=L*clamp(u);g.strokeStyle=col;g.lineWidth=w*V.s;g.beginPath();g.moveTo(Q[0][0],Q[0][1]+dy*V.s);
    for(let i=1;i<Q.length&&reste>0;i++){const k=Math.min(1,reste/ls[i-1]);g.lineTo(lerp(Q[i-1][0],Q[i][0],k),lerp(Q[i-1][1],Q[i][1],k)+dy*V.s);reste-=ls[i-1];}g.stroke();}
  g.restore();}
// l'onde au sol quand un objet se pose
function onde(x,y,r,d){if(d<0||d>.7)return;const [px,py]=P(x,y,0);const k=d/.7;g.save();g.globalCompositeOperation='lighter';g.strokeStyle=`rgba(255,160,80,${.9*(1-k)})`;g.lineWidth=5*(1-k)+1;
  g.beginPath();g.ellipse(px,py,V.s*(r+k*220),V.s*(r+k*220)*Math.cos(V.ph),0,0,7);g.stroke();g.restore();}
// le prix, debout au-dessus de l'objet
function prixDebout(txt,p,b0,b,align='center'){if(b<b0)return;const k=spring((b-b0)*B,15,.55),fl=Math.exp(-(b-b0)*B*4);
  g.save();g.globalAlpha*=clamp(k*1.6);g.translate(p[0],p[1]);g.scale(.6+.4*clamp(k),.6+.4*clamp(k));
  g.font='800 60px JBMono';const w=g.measureText(txt).width+48,x0=align==='left'?-12:-w/2;g.fillStyle='rgba(4,14,28,.8)';rr(x0,-44,w,88,26);g.fill();
  g.strokeStyle=`rgba(255,138,61,${.5+.5*fl})`;g.lineWidth=2.5;rr(x0,-44,w,88,26);g.stroke();
  lueur(`rgba(255,138,61,${.6+.4*fl})`,24+40*fl);texte(txt,x0+w/2,2,60,ORANGE,800,'JBMono');g.restore();}

function dessinItem(it,u,b,t){
  const [x,y]=it.at;let p=null;
  if(it.dessin==='ballon'){p=arc(x,y,70,-Math.PI/2,Math.PI*1.5,u,4);if(u>.3)arc(x,y,52,Math.PI/2,Math.PI*2.5,seg(u,.3,.8),2);
    if(u>.6){g.save();g.globalAlpha*=seg(u,.6,1);texte('CE',x,y-10,34,TRAIT,800,'Archivo');texte('200 L',x,y+24,22,BLEU,700,'Archivo');g.restore();}}
  else if(it.dessin==='vanne'){p=trace([[x,y-128],[x,y-32],[x-28,y-32],[x+28,y+32],[x-28,y+32],[x+28,y-32],[x,y-32]],seg(u,0,.75),4);
    if(u>.5){trace([[x,y+32],[x,y+100]],seg(u,.5,.8),4);trace([[x,y],[x+56,y]],seg(u,.6,.9),4,ORANGE);if(u>.85){g.save();g.globalAlpha*=seg(u,.85,1);g.strokeStyle=ORANGE;g.lineWidth=4;g.beginPath();g.arc(x+66,y,10,0,7);g.stroke();g.restore();}}}
  else if(it.dessin==='depose'){g.save();g.setLineDash([14,12]);p=arc(x,y,62,0,Math.PI*2,u,3);g.restore();if(u>.5){const k=seg(u,.5,1);trace([[x-50,y-50],[x+50,y+50]],k,4,ORANGE);trace([[x+50,y-50],[x-50,y+50]],k,4,ORANGE);}}
  else if(it.dessin==='horloge'){p=arc(x,y,52,-Math.PI/2,Math.PI*1.5,u,4);
    if(u>.4){const k=seg(u,.4,1);g.save();g.globalAlpha*=k;g.strokeStyle=TRAIT;g.lineWidth=2;for(let i=0;i<12;i++){const a=i/12*Math.PI*2;g.beginPath();g.moveTo(x+Math.cos(a)*40,y+Math.sin(a)*40);g.lineTo(x+Math.cos(a)*46,y+Math.sin(a)*46);g.stroke();}
      g.strokeStyle=ORANGE;g.lineWidth=5;g.lineCap='round';const am=-Math.PI/2+k*Math.PI*6,ah=-Math.PI/2+k*Math.PI/2;
      g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(am)*36,y+Math.sin(am)*36);g.moveTo(x,y);g.lineTo(x+Math.cos(ah)*24,y+Math.sin(ah)*24);g.stroke();g.restore();}}
  return p;
}
function etiquette(it,b){        // la cote et le prix, qui s'allument comme un néon
  const k=spring((b-(it.b+.9))*B,14,.6);if(b<it.b+.9)return;
  const [lx,ly]=it.lab,[x,y]=it.at;
  const off=lx>x?110:-60;trace([[x+(lx>x?80:-80),y],[lx>x?lx-10:lx+20,ly]],clamp(k*1.3),2,BLEU);
  g.save();g.globalAlpha*=clamp(k*1.6);g.translate(lx,ly);g.scale(.7+.3*clamp(k),.7+.3*clamp(k));
  const flash=Math.exp(-(b-(it.b+.9))*3);lueur(`rgba(255,138,61,${.6+.4*flash})`,28+40*flash);
  texte(it.prix,off,0,62,ORANGE,800,'JBMono');
  g.restore();
}
function cartouche(b,u){
  const {x,y,w,h}=CART;
  trace([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],u,4,TRAIT,true);
  if(u>.5){const k=seg(u,.5,1);trace([[x,y+90],[x+w,y+90]],k,2);if(b>4.4)trace([[x+w-300,y+90],[x+w-300,y+h]],seg(b,4.4,5),2);
    g.save();g.globalAlpha=k;texte('PROJET',x+24,y+30,22,BLEU,600,'Archivo','left');texte('Salle de bain · Mme Fontaine',x+24,y+62,30,TRAIT,600,'Archivo','left');
    g.restore();if(b>4.6){g.save();g.globalAlpha=seg(b,4.6,5.1);texte('TOTAL TTC',x+w-276,y+120,22,BLEU,600,'Archivo','left');g.restore();}}
}

function seek(T){
  const t=((T%DN)+DN)%DN,b=t/B;
  g.setTransform(1,0,0,1,0,0);g.drawImage(FOND,0,0);
  const cam=camAt(b);
  // la vue : à plat jusqu'au total, puis le plan bascule et tourne lentement
  const k3=ease(seg(b,B_3D,B_3D+1.5));
  V={cx:cam.x,cy:cam.y,s:cam.z,th:-.3*ease(seg(b,B_3D,B_PLIE+.6)),ph:.9*k3,Y0:960+80*k3};
  // le pliage : tout se rabat, puis le plan se replie sur lui-même et devient un avion
  const plie=seg(b,B_PLIE+.5,B_PLIE+1.9),part=b>=B_PLIE+1.9,hk=1-ease(seg(b,B_PLIE,B_PLIE+.6));
  const replie=()=>{g.setTransform(1,0,0,1,0,0);g.translate(540,960);g.scale(1,1-ease(plie)*.98);g.rotate(-ease(plie)*.25);g.translate(-540,-960);};
  if(!part){
    replie();g.save();sol();
    g.globalAlpha=1-seg(plie,.85,1);
    quadrillage(V.s);
    // le cartouche se trace d'abord, avec l'accroche dedans
    cartouche(b,seg(b,0,1.2));
    const kh=spring(b*B,13,.6);
    if(b<4.4){g.save();g.globalAlpha=clamp(kh*1.5)*(1-seg(b,3.6,4.4));lueur('rgba(255,138,61,.8)',30);texte('PLOMBIER ?',CART.x+CART.w/2,CART.y+195,104,'#fff',900,'Archivo');g.restore();}
    // la pièce se trace
    const pPiece=trace(PIECE,seg(b,2.4,4.6),6,TRAIT,true);etincelles(pPiece,3,t,1.2);
    const pPorte=arc(140,1300,120,-Math.PI/2,0,seg(b,4.2,4.9),3);etincelles(pPorte,9,t,.8);
    if(b>4.4){g.save();g.globalAlpha*=seg(b,4.4,4.9);texte('SALLE DE BAIN · 8,4 m²',540,470,26,BLEU,600,'Archivo');g.restore();}
    // les éléments dictés, dessinés avec leur vrai symbole ; les prix à plat s'effacent quand le plan bascule
    ITEMS.forEach((it,i)=>{if(b<it.b)return;const u=seg(b,it.b,it.b+.9);etincelles(dessinItem(it,u,b,t),20+i*13,t,1);g.save();g.globalAlpha*=1-k3;etiquette(it,b);g.restore();});
    // le total dans le cartouche : il frappe, onde de lumière et éclats
    if(b>=B_TOT){const k=spring((b-B_TOT)*B,16,.5),d=(b-B_TOT)*B;
      g.save();g.translate(CART.x+CART.w-150,CART.y+205);g.scale(1.5-.5*clamp(k),1.5-.5*clamp(k));g.globalAlpha*=clamp(k*2);lueur('rgba(255,138,61,.9)',30+50*Math.exp(-d*4));
      texte('872,30 €',0,0,50,ORANGE,800,'JBMono');g.restore();
      if(d<.8){g.save();g.globalCompositeOperation='lighter';g.strokeStyle=`rgba(255,170,90,${.8*(1-d/.8)})`;g.lineWidth=6*(1-d/.8);g.beginPath();g.arc(CART.x+CART.w-150,CART.y+205,40+d*420,0,7);g.stroke();
