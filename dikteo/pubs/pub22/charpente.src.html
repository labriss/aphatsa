<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diktéo · la charpente</title>
<style>
/*FONTS*/
html,body{margin:0;background:#050505;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#ui{position:absolute;left:0;bottom:0;width:100%;padding:10px;background:#111;color:#ccc;font:14px sans-serif;display:flex;gap:10px;align-items:center;box-sizing:border-box}
#ui input{flex:1}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="lecture">Lecture</button><input id="curseurUI" type="range" min="0" max="1000" value="0"><span id="temps">0.00</span></div>
<script>
/* Pub 22 « la charpente » : pour les charpentiers. Une charpente vue en coupe sous le toit, la nuit : fermes, pannes,
   chevrons. Elle est fatiguée : six chevrons pourris, une panne qui fléchit, le tout penche. Chaque phrase dictée répare
   pour de vrai : les chevrons en sapin neuf remontent la pente, le traitement balaie le bois, la panne en chêne glisse
   depuis le fond ; tout se remet d'aplomb (la bulle du niveau revient au centre), la lune sort.
   161,5 BPM (1 temps = 0,37 s), 41 temps (15,2 s).
   b0 « CHARPENTIER ? » + « Ton devis, tu le fais encore sur une poutre ? »   b6.5…18.5 les quatre lignes (1,5 s chacune)
   b22.5 tout d'aplomb, le total   b27.5 envoi   b33 carton */
const W=1080,H=1920,BPM=161.5,B=60/BPM,NB=41,DN=NB*B;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
function spring(t,w=14,z=.62){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const rnd=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const O1='#E8650F',O2='#C9480A',O3='#A8350A',ORANGE='#ff8a3d';
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function texte(t,x,y,size,col,poids=700,font='Archivo',align='center'){g.font=`${poids} ${size}px ${font}`;g.fillStyle=col;g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y);}
function lueur(col,flou){g.shadowColor=col;g.shadowBlur=flou;}
// motion design : arrivée à longue traîne, sans rebond ; mots qui passent du flou au net puis ne bougent plus
const expoOut=x=>(x=clamp(x),x>=1?1:1-Math.pow(2,-10*x));
function motsFlous(t,x,y,size,col,poids,font,align,b,b0,ec=.25,du=.6){g.font=`${poids} ${size}px ${font}`;const ws=t.split(' '),sp=g.measureText(' ').width,wd=ws.map(w=>g.measureText(w).width),L=wd.reduce((a,c)=>a+c,0)+sp*(ws.length-1);
  let cx=align==='center'?x-L/2:align==='right'?x-L:x;ws.forEach((w,i)=>{const k=expoOut(seg(b,b0+i*ec,b0+i*ec+du));if(k>0){g.save();g.globalAlpha*=k;if(k<1)g.filter=`blur(${((1-k)*8).toFixed(2)}px)`;texte(w,cx,y,size,col,poids,font,'left');g.restore();}cx+=wd[i]+sp;});}

const ITEMS=[
  {b:6.5, dit:'« Six chevrons sapin,', dit2:'68 euros pièce. »'},
  {b:10.5,dit:'« Traitement du bois, 40 m²,', dit2:'14 euros le mètre. »'},
  {b:14.5,dit:'« Panne en chêne, 4 mètres,', dit2:'95 euros le mètre. »'},
  {b:18.5,dit:'« Main-d’œuvre, 16 heures,', dit2:'52 euros de l’heure. »'},
];
const T_CHE=6.8, T_TRT=10.8, T_PAN=14.8, T_MO=18.8, B_ON=22.5, B_ENV=27.5, B_TXT=28.5, B_FIN=33;
const TOTAL=2398;   // (6×68 + 40×14 + 4×95 + 16×52) = 2 180 € HT, TVA 10 % → 2 398 € TTC
// la charpente, vue en coupe : la ferme de devant (k=0), les deux pans qui filent vers le fond (vecteur D), la ferme du fond (k=1)
const L=[40,1300], R=[900,1300], A=[470,560], D=[250,-70], PIV=[470,1300];
const P=(s,k)=>[L[0]+s*(A[0]-L[0])+k*D[0], L[1]+s*(A[1]-L[1])+k*D[1]];   // pan gauche
const Q=(s,k)=>[R[0]+s*(A[0]-R[0])+k*D[0], R[1]+s*(A[1]-R[1])+k*D[1]];   // pan droit
const NCH=8, ABIMES=[1,2,3,4,5,6];   // les chevrons du pan gauche ; six sont pourris
const S_PAN=.5;                      // la panne intermédiaire du pan gauche, à remplacer par du chêne

function etincelles(x,y,seed,t,force=1,col=[255,200,140]){if(t<0||t>1)return;g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<22*force;i++){const a=rnd(seed+i*7)*Math.PI*2,v=(60+rnd(seed+i*3)*260)*force,px=x+Math.cos(a)*v*t,py=y+Math.sin(a)*v*t+t*t*200;
    g.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${1-t})`;g.beginPath();g.arc(px,py,3*(1-t)+.8,0,7);g.fill();}g.restore();}
let FADE=1;
function etiquette(nom,prix,x,y,b0,b){if(b<b0||FADE<=0)return;const k=expoOut(seg(b,b0,b0+1.4)),fl=Math.exp(-(b-b0)*B*4),vieux=b>b0+3?.55:1;
  g.font='700 36px Archivo';const w1=g.measureText(nom).width;g.font='800 46px JBMono';const w2=g.measureText(prix).width,w=w1+w2+76;
  const xmax=(y+40>820&&y-40<1600)?940:1060,cx=clamp(x,w/2+20,xmax-w/2);   // zone sûre : pas sous les boutons de droite
  g.save();g.globalAlpha*=clamp(k*1.4)*vieux*FADE;if(k<1)g.filter=`blur(${((1-k)*8).toFixed(2)}px)`;g.translate(cx,y+(1-k)*14);g.scale(.94+.06*k,.94+.06*k);
  g.fillStyle='rgba(10,12,16,.88)';rr(-w/2,-40,w,80,28);g.fill();g.strokeStyle=`rgba(255,138,61,${.45+.5*fl})`;g.lineWidth=2.5;rr(-w/2,-40,w,80,28);g.stroke();
  texte(nom,-w/2+26,2,36,'#eef0f2',700,'Archivo','left');lueur(`rgba(255,138,61,${.4+.4*fl})`,16+30*fl);texte(prix,w/2-26,2,46,ORANGE,800,'JBMono','right');g.restore();}
// la dictée en direct : « TU DICTES », les mots s'écrivent au rythme de la voix, curseur, micro qui pulse
function dictee(it,b,mx,my,tx,y0,size){
  const L1=it.dit.length,L2=it.dit2.length,u=seg(b,it.b+.05,it.b+2.8),n=Math.floor(u*(L1+L2));
  const s1=it.dit.slice(0,Math.min(n,L1)),s2=it.dit2.slice(0,Math.max(0,n-L1));
  texte('TU DICTES',tx,y0-2,30,ORANGE,900,'Archivo','left');
  texte(s1,tx,y0+54,size,'#fff',700,'Archivo','left');if(s2)texte(s2,tx,y0+54+size*1.3,size,ORANGE,700,'Archivo','left');
  if(u<1||Math.floor(b*2)%2===0){g.font=`700 ${size}px Archivo`;const yy=s2?y0+54+size*1.3:y0+54,ww=g.measureText(s2||s1).width;g.fillStyle=s2?ORANGE:'#fff';g.fillRect(tx+ww+6,yy-size*.45,4,size*.9);}
  if(u<1){g.save();g.globalCompositeOperation='lighter';for(let k=0;k<2;k++){const ph=((b-it.b)*1.2+k*.5)%1;g.strokeStyle=`rgba(255,138,61,${.7*(1-ph)})`;g.lineWidth=3;g.beginPath();g.arc(mx,my,46+ph*36,0,7);g.stroke();}g.restore();}
}

// le traitement : un nuage de produit balaie la charpente de gauche à droite ; derrière lui le bois est nourri (plus chaud, satiné)
let SWEEP=-1e9;
const traite=x=>clamp((SWEEP-x)/140);
function teinte(c,x,fonce=1){const k=traite(x);return `rgb(${Math.round(lerp(c[0],c[0]*1.12+14,k)*fonce)},${Math.round(lerp(c[1],c[1]*1.02+6,k)*fonce)},${Math.round(lerp(c[2],c[2]*.82,k)*fonce)})`;}
// une pièce de bois droite (poutre vue de face) : corps, arête claire, fil du bois ; courbe = flèche (en px) vers le bas au milieu
function poutre(p0,p1,ep,col,fonce=1,courbe=0,lustre=true){
  const dx=p1[0]-p0[0],dy=p1[1]-p0[1],l=Math.hypot(dx,dy),ang=Math.atan2(dy,dx),xm=(p0[0]+p1[0])/2;
  g.save();g.translate(p0[0],p0[1]);g.rotate(ang);
  const up=Math.cos(ang)>=0?1:-1, f=courbe*up;   // la flèche part vers le bas de l'écran
  g.beginPath();g.moveTo(0,-ep/2);g.quadraticCurveTo(l/2,-ep/2+f*2,l,-ep/2);g.lineTo(l,ep/2);g.quadraticCurveTo(l/2,ep/2+f*2,0,ep/2);g.closePath();
  g.fillStyle=teinte(col,xm,fonce);g.fill();
  g.save();g.clip();
  g.fillStyle=`rgba(0,0,0,${.28})`;g.fillRect(0,ep*.18+f,l,ep);   // le dessous dans l'ombre
  g.strokeStyle='rgba(255,235,200,.10)';g.lineWidth=1.4;for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,-ep/2+ep*i/4);g.quadraticCurveTo(l/2,-ep/2+ep*i/4+f*2,l,-ep/2+ep*i/4);g.stroke();}
  const kt=traite(xm);if(lustre&&kt>0){g.fillStyle=`rgba(255,215,150,${.16*kt})`;g.fillRect(0,-ep/2,l,ep*.3);}
  g.restore();
  g.strokeStyle=`rgba(255,225,180,${.22*fonce})`;g.lineWidth=2;g.beginPath();g.moveTo(0,-ep/2);g.quadraticCurveTo(l/2,-ep/2+f*2,l,-ep/2);g.stroke();
  g.restore();}
const VIEUX=[92,64,40], ABIME=[104,100,88], SAPIN=[226,190,128], CHENE=[150,98,52], FERME=[118,80,48];

function charpente(b,t,tord){
  // le grenier : nuit chaude sous la charpente
  const ang=-.035*tord;
  g.save();g.translate(PIV[0],PIV[1]);g.rotate(ang);g.translate(-PIV[0],-PIV[1]);
  // la sous-face des deux pans (voliges), sombres, avec les liteaux parallèles au faîtage
  const pan=(F,col)=>{const a=F(0,0),c=F(1,0),d=F(1,1),e=F(0,1);g.fillStyle=col;g.beginPath();g.moveTo(...a);g.lineTo(...c);g.lineTo(...d);g.lineTo(...e);g.closePath();g.fill();
    g.strokeStyle='rgba(120,84,52,.35)';g.lineWidth=3;for(let s=.06;s<1;s+=.075){const p0=F(s,0),p1=F(s,1);g.beginPath();g.moveTo(...p0);g.lineTo(...p1);g.stroke();}};
  pan(Q,'#1a130e');pan(P,'#21170f');
  // la lumière de la baladeuse, accrochée à la faîtière
  const lx=lerp(A[0],A[0]+D[0],.45),ly=lerp(A[1],A[1]+D[1],.45);
  const gl=g.createRadialGradient(lx,ly+380,30,lx,ly+380,720);gl.addColorStop(0,'rgba(255,190,120,.26)');gl.addColorStop(1,'rgba(255,160,80,0)');g.fillStyle=gl;g.fillRect(-100,300,1300,1100);
  // les chevrons du pan droit (sains)
  for(let i=0;i<NCH;i++){const k=i/(NCH-1);poutre(Q(0,k),Q(1,k),20-6*k,FERME,.55+.25*(1-k));}
  // les chevrons du pan gauche : six pourris, remplacés un à un par du sapin neuf
  for(let i=NCH-1;i>=0;i--){const k=i/(NCH-1),j=ABIMES.indexOf(i),ep=26-6*k,fo=.6+.3*(1-k);
    if(j<0){poutre(P(0,k),P(1,k),ep,FERME,fo);continue;}
    const b0=T_CHE+.2+j*.22;
    if(b<b0){   // le vieux : gris, fendu, il fléchit et perd sa sciure
      const s0=.38+.2*rnd(i),p0=P(0,k),pm=P(s0,k),pm2=P(s0+.05,k),p1=P(1,k);
      poutre(p0,pm,ep,ABIME,fo*.9,4+3*rnd(i+3),false);poutre([pm2[0],pm2[1]+10],p1,ep,ABIME,fo*.9,3,false);
      g.fillStyle='rgba(0,0,0,.5)';for(let h=0;h<5;h++){const q=P(.15+.7*rnd(i*9+h),k);g.beginPath();g.arc(q[0]+4,q[1]+2,2.2,0,7);g.fill();}   // les trous de vers
    }else{const d=(b-b0)*B,kk=clamp(spring(d,16,.6),0,1.2),off=(1-kk)*-140;   // le neuf remonte la pente
      const u=[(A[0]-L[0])/1000,(A[1]-L[1])/1000];g.save();g.globalAlpha*=clamp(d*6);
      poutre([P(0,k)[0]+u[0]*off,P(0,k)[1]+u[1]*off],[P(1,k)[0]+u[0]*off,P(1,k)[1]+u[1]*off],ep,SAPIN,fo);g.restore();
      if(d<.5){const q=P(.45,k);etincelles(q[0],q[1],j*13,d/.5,.5,[245,215,160]);}}}
  // les pannes : sablières en bas, intermédiaires au milieu des pans, faîtière en haut (elles portent les chevrons)
  poutre(Q(.5,0),Q(.5,1),30,FERME,.75);poutre(Q(.02,0),Q(.02,1),26,FERME,.7);poutre(P(.02,0),P(.02,1),26,FERME,.7);
  {const pk=b<T_PAN-.7?0:1-Math.pow(1-seg(b,T_PAN-.7,T_PAN),2),kv=1-seg(b,T_PAN-.7,T_PAN-.3);   // la vieille panne s'efface, la chêne glisse depuis le fond
    if(kv>0){g.save();g.globalAlpha*=kv;poutre(P(S_PAN,0),P(S_PAN,1),32,ABIME,.85,14,false);g.restore();}
    if(b>=T_PAN-.7){const off=(1-pk)*1.4,ch=b>=T_PAN?Math.exp(-(b-T_PAN)*B*8)*Math.sin((b-T_PAN)*B*40)*5:0;
      g.save();g.translate(0,ch);poutre(P(S_PAN,off),P(S_PAN,1+off),36,CHENE,.95);g.restore();
      if(b>=T_PAN){const d=(b-T_PAN)*B;if(d<.6){const q=P(S_PAN,.15);etincelles(q[0],q[1],77,d/.6,.8,[255,200,140]);}}}}
  poutre(A,[A[0]+D[0],A[1]+D[1]],34,FERME,.8);
  // la ferme du fond, plus sombre
  ferme(1,.5);
  // la baladeuse
  g.strokeStyle='#3a2c20';g.lineWidth=3;g.beginPath();g.moveTo(lx,ly);g.lineTo(lx,ly+330);g.stroke();
  g.fillStyle='#ffd9a8';lueur('rgba(255,190,120,.9)',34);g.beginPath();g.arc(lx,ly+346,15,0,7);g.fill();g.shadowBlur=0;
  // la couverture vue en coupe : les tuiles par-dessus les pans, et le faîtage
  g.fillStyle='#5a2a1a';g.beginPath();g.moveTo(L[0]-40,L[1]-6);g.lineTo(A[0],A[1]-46);g.lineTo(R[0]+40,R[1]-6);g.lineTo(R[0]+40,R[1]-34);g.lineTo(A[0],A[1]-76);g.lineTo(L[0]-40,L[1]-34);g.closePath();g.fill();
  g.strokeStyle='rgba(255,170,120,.18)';g.lineWidth=2;g.stroke();
  // la ferme de devant
  ferme(0,1);
  // le niveau à bulle posé sur l'entrait : la bulle revient au centre quand tout est d'aplomb
  {const nx=760,ny=1263;g.fillStyle='#d8b23a';rr(nx-80,ny-15,160,30,6);g.fill();g.fillStyle='#1c2a1a';rr(nx-34,ny-9,68,18,9);g.fill();
    const bx=clamp(-ang*1400,-24,24);g.fillStyle=tord<.05?'#b6f08a':'#d6f5a0';g.beginPath();g.ellipse(nx+bx,ny,9,6,0,0,7);g.fill();
    g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=2;g.beginPath();g.moveTo(nx-12,ny-9);g.lineTo(nx-12,ny+9);g.moveTo(nx+12,ny-9);g.lineTo(nx+12,ny+9);g.stroke();}
  g.restore();
  // la sciure qui tombe des vieux chevrons
  const restants=ABIMES.filter((i,j)=>b<T_CHE+.2+j*.22).length/ABIMES.length,pou=Math.max(restants,.25)*tord;
  if(pou>0){for(let i=0;i<40;i++){const ph=(t*.35+rnd(i*4.1))%1,x=150+rnd(i*2.3)*600,y=lerp(800+rnd(i)*200,1600,ph);g.fillStyle=`rgba(230,200,150,${.5*pou*(1-ph)})`;g.beginPath();g.arc(x+Math.sin(t*2+i)*8,y,1.6+rnd(i*7)*1.6,0,7);g.fill();}}
  // le nuage du traitement
  if(SWEEP>-200&&SWEEP<1300){g.save();g.globalCompositeOperation='lighter';for(let i=0;i<60;i++){const x=SWEEP-rnd(i*3.7)*160,y=520+rnd(i*5.3)*800,r=10+rnd(i)*30;
    const gm=g.createRadialGradient(x,y,0,x,y,r);gm.addColorStop(0,'rgba(255,220,160,.16)');gm.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gm;g.beginPath();g.arc(x,y,r,0,7);g.fill();}g.restore();}
}
// une ferme : deux arbalétriers, l'entrait, le poinçon, deux jambes de force (k : profondeur)
function ferme(k,fo){const o=[D[0]*k,D[1]*k],m=p=>[p[0]+o[0],p[1]+o[1]],sc=1-.3*k;
  const pd=m([A[0],1150]),jg=m(P(.5,0)),jd=m(Q(.5,0));
  poutre(m([A[0],A[1]+10]),m([A[0],PIV[1]]),34*sc,FERME,fo);
  poutre(pd,jg,26*sc,FERME,fo*.95);poutre(pd,jd,26*sc,FERME,fo*.95);
  poutre(m(L),m(A),42*sc,FERME,fo);poutre(m(R),m(A),42*sc,FERME,fo);
  poutre(m([L[0]-30,L[1]+10]),m([R[0]+30,R[1]+10]),48*sc,FERME,fo);
  if(!k){g.fillStyle='rgba(30,22,16,.9)';[[A[0],A[1]+30],[A[0],1150],jg,jd].forEach(p=>{g.beginPath();g.arc(p[0],p[1],6,0,7);g.fill();});}}   // les chevilles
function ciel(b,t,tord){
  const gr=g.createLinearGradient(0,0,0,1300);gr.addColorStop(0,'#0a1020');gr.addColorStop(1,'#151d2a');g.fillStyle=gr;g.fillRect(0,0,W,H);
  // la lune, quand tout est d'aplomb
  const kl=1-tord;if(kl>0){g.save();g.globalAlpha=kl;const gl=g.createRadialGradient(250,300,20,250,300,260);gl.addColorStop(0,'rgba(230,236,245,.35)');gl.addColorStop(1,'rgba(230,236,245,0)');g.fillStyle=gl;g.fillRect(0,40,520,520);
    g.fillStyle='#e9edf2';g.beginPath();g.arc(250,300,62,0,7);g.fill();g.restore();}
  for(let i=0;i<70;i++){g.fillStyle=`rgba(255,255,255,${(.15+rnd(i)*.4)*(.5+.5*kl)})`;g.beginPath();g.arc(rnd(i*3.3)*W,rnd(i*7.7)*700,rnd(i*5)*1.6+.3,0,7);g.fill();}
  // le mur porteur et le plancher sous la ferme
  g.fillStyle='#14100c';g.fillRect(0,1300,W,300);g.fillStyle='#2a1f16';g.fillRect(0,1590,W,30);g.fillStyle='#0c0a08';g.fillRect(0,1620,W,H-1620);
}

function seek(T){
  const t=((T%DN)+DN)%DN,b=t/B;
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.shadowBlur=0;g.setLineDash([]);g.filter='none';
  // la charpente fatiguée penche un peu ; elle se remet d'aplomb quand tout est fait
  const tord=1-ease(seg(b,B_ON,B_ON+2.5));
  SWEEP=b<T_TRT?-1e9:lerp(-150,1250,ease(seg(b,T_TRT,T_TRT+2.6)));
  ciel(b,t,tord);
  const kz=1+.03*seg(b,5,B_ENV);g.save();g.translate(540,1000);g.scale(kz,kz);g.translate(-540,-1000);
  charpente(b,t,tord);
  g.restore();
  // un craquement du bois pendant l'accroche
  {const d=(b-1.2)*B;if(d>0&&d<.35){g.save();g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,200,150,${.08*Math.sin(d/.35*Math.PI)})`;g.fillRect(0,0,W,H);g.restore();}}
  // l'accroche
  if(b<6.2){const so=seg(b,5.5,6.2),a=1-so;g.save();g.globalAlpha=a;g.fillStyle='rgba(6,8,12,.55)';g.fillRect(0,0,W,H);if(so>0)g.filter=`blur(${(so*8).toFixed(2)}px)`;
    lueur('rgba(0,0,0,.9)',30);motsFlous('CHARPENTIER ?',540,760,104,'#f2f4f6',900,'Archivo','center',b,-1,.25,.7);   // déjà net à l'image 0 (la vignette)
