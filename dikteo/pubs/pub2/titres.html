<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Titres des pubs Diktéo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Public+Sans:wght@500;600;700&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
  /* Couleurs : copie des valeurs du thème (src/lib/theme-colors.ts), comme pour les PDF et les e-mails. */
  :root {
    --o1: #E8650F; --o2: #C9480A; --o3: #A8350A;
    --fond: #0E1412; --encre: #E7EDEA; --clair: #F2F5F3; --nuit: #15201B; --vert: #1E7A4C;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #scene { position: relative; overflow: hidden; font-family: "Public Sans", sans-serif; color: #fff; }
  .calque { position: absolute; inset: 0; pointer-events: none; }
  .mots { position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center;
          gap: 0 .26em; padding: 0 var(--marge); font: 900 var(--taille)/1.02 "Archivo", sans-serif;
          letter-spacing: -.035em; text-align: center; }
  .mot { display: inline-block; text-shadow: 0 4px 24px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5); will-change: transform; }
  .mot.accent { color: var(--o1); }
  .mot.numero { flex-basis: 100%; font: 900 calc(var(--taille) * 1.6)/1 "JetBrains Mono"; color: var(--o1); margin-bottom: .12em; }
  .pilules { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; }
  .pilule { font: 700 42px/1 "Public Sans"; padding: 18px 28px; border-radius: 999px; background: rgba(14,20,18,.82);
            border: 2px solid rgba(232,101,15,.7); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .notif { position: absolute; left: 50%; width: 900px; margin-left: -450px; border-radius: 40px; padding: 30px 34px;
           background: rgba(242,245,243,.94); color: var(--nuit); display: flex; gap: 26px; align-items: center;
           box-shadow: 0 30px 80px rgba(0,0,0,.45); backdrop-filter: blur(20px); }
  .notif .ic { flex: none; width: 96px; height: 96px; border-radius: 24px; display: grid; place-items: center;
               background: linear-gradient(135deg, var(--o1), var(--o2) 55%, var(--o3)); }
  .notif .ic svg { width: 62px; height: 62px; }
  .notif b { font: 800 34px/1.1 "Archivo"; letter-spacing: -.02em; }
  .notif p { margin: 8px 0 0; font: 500 32px/1.25 "Public Sans"; }
  .notif small { margin-left: auto; align-self: flex-start; font: 600 26px "Public Sans"; color: #56645E; }
  .cta { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px;
         white-space: nowrap; padding: 20px 34px 20px 22px; border-radius: 999px; font: 700 36px/1 "Public Sans";
         background: linear-gradient(135deg, var(--o1), var(--o2) 55%, var(--o3)); color: #fff;
         box-shadow: 0 14px 40px rgba(201,72,10,.45); }
  .cta .pt { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; }
  .cta .pt svg { width: 30px; height: 30px; }
  .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, rgba(255,170,90,.9), rgba(232,101,15,.6) 45%, rgba(168,53,10,0) 80%); }
  .fin { position: absolute; inset: 0; background: var(--fond); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .fin .halo { position: absolute; width: 1400px; height: 1400px; border-radius: 50%;
               background: radial-gradient(circle, rgba(232,101,15,.42), rgba(201,72,10,.12) 45%, rgba(14,20,18,0) 70%); }
  .fin .logo { position: relative; display: flex; align-items: center; gap: 22px; font: 900 150px/1 "Archivo"; letter-spacing: -.045em; color: var(--encre); }
  .fin .logo svg { width: 150px; height: 150px; color: var(--o1); }
  .fin .slogan { position: relative; margin-top: 46px; font: 800 58px/1.1 "Archivo"; letter-spacing: -.03em; color: var(--encre); text-align: center; }
  .fin .slogan em { font-style: normal; color: var(--o1); }
  .fin .offre { position: relative; margin-top: 40px; font: 600 40px/1.35 "Public Sans"; color: rgba(231,237,234,.82); text-align: center; }
  .fin .bouton { position: relative; margin-top: 64px; padding: 30px 56px; border-radius: 999px; font: 800 50px/1 "Archivo"; letter-spacing: -.02em;
                 background: linear-gradient(135deg, var(--o1), var(--o2) 55%, var(--o3)); color: #fff; box-shadow: 0 20px 60px rgba(201,72,10,.5); }
  .fin .url { position: relative; margin-top: 30px; font: 700 40px/1 "JetBrains Mono"; color: rgba(231,237,234,.9); }
  .chrono { position: absolute; display: flex; align-items: baseline; gap: 10px; padding: 22px 34px; border-radius: 34px;
            background: rgba(14,20,18,.86); border: 3px solid var(--o1); font: 700 96px/1 "JetBrains Mono"; color: #fff;
            box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .chrono small { font: 700 40px/1 "JetBrains Mono"; color: var(--o1); }
  .tampon { position: absolute; left: 50%; font: 900 120px/1 "Archivo"; letter-spacing: -.04em; color: #fff; padding: 26px 56px; border-radius: 30px;
            background: var(--vert); transform-origin: center; box-shadow: 0 30px 80px rgba(0,0,0,.45); white-space: nowrap; }
</style>
</head>
<body>
<div id="scene"></div>
<script>
// Une scène = un JSON de calques, chacun avec son début (t0) et sa fin (t1), en secondes.
// rendre(t) redessine tout pour l'instant t, sans transition CSS : chaque image est exacte.
const MARQUE = '<svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M6.5 2.5H12a9 9 0 0 1 0 18H9.2L4.5 23V4.5a2 2 0 0 1 2-2ZM9.2 9.5a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1Zm3.1-2.5a1 1 0 0 0-1 1v7a1 1 0 0 0 2 0V8a1 1 0 0 0-1-1Zm3.1 2a1 1 0 0 0-1 1v3a1 1 0 0 0 2 0v-3a1 1 0 0 0-1-1Z"/></svg>';
const FLECHE = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);                 // sortie douce
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // léger rebond
const io = (t, t0, t1, din = .18, dout = .16) => Math.min(ease((t - t0) / din), ease((t1 - t) / dout));

let S = null;
window.charger = (spec) => {
  S = spec;
  const sc = document.getElementById('scene');
  sc.style.width = spec.l + 'px'; sc.style.height = spec.h + 'px';
  sc.innerHTML = '';
  spec.calques.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'calque'; el.id = 'c' + i;
    if (c.type === 'mots') {
      el.innerHTML = `<div class="mots" style="top:${c.y}px;--taille:${c.taille || 96}px;--marge:${c.marge || 70}px;left:${c.gauche || 0}px;right:${c.droite || 0}px;justify-content:${c.aligne || 'center'};text-align:${c.aligne === 'flex-start' ? 'left' : 'center'}">` + (c.numero ? `<span class="mot numero">${c.numero}</span>` : '') +
        c.mots.map((m) => `<span class="mot${m.accent ? ' accent' : ''}">${m.w}</span>`).join('') + '</div>';
    } else if (c.type === 'pilules') {
      el.innerHTML = `<div class="pilules" style="top:${c.y}px">` + c.items.map((x) => `<span class="pilule">${x}</span>`).join('') + '</div>';
    } else if (c.type === 'notif') {
      el.innerHTML = `<div class="notif" style="top:${c.y}px"><span class="ic" style="color:#fff">${MARQUE}</span><div><b>${c.titre}</b><p>${c.texte}</p></div><small>maintenant</small></div>`;
    } else if (c.type === 'cta') {
      el.innerHTML = `<div class="cta" style="top:${c.y}px"><span class="pt">${FLECHE}</span>${c.texte}</div>`;
    } else if (c.type === 'flash') {
      el.innerHTML = '<div class="flash"></div>';
    } else if (c.type === 'fin') {
      el.innerHTML = `<div class="fin"><div class="halo"></div><div class="logo">${MARQUE}<span>Diktéo</span></div>
        <div class="slogan">${c.slogan}</div><div class="offre">${c.offre}</div><div class="bouton">${c.bouton}</div><div class="url">${c.url}</div></div>`;
    } else if (c.type === 'chrono') {
      el.innerHTML = `<div class="chrono" style="left:${c.x}px;top:${c.y}px"><span class="v">0,0</span><small>s</small></div>`;
    } else if (c.type === 'tampon') {
      el.innerHTML = `<div class="tampon" style="top:${c.y}px">${c.texte}</div>`;
    }
    sc.appendChild(el);
  });
};

window.rendre = (t) => {
  S.calques.forEach((c, i) => {
    const el = document.getElementById('c' + i);
    const on = t >= c.t0 - .001 && t <= c.t1 + .001;
    el.style.display = on ? '' : 'none';
    if (!on) return;
    const v = io(t, c.t0, c.t1, c.din ?? .18, c.dout ?? .16);
    if (c.type === 'mots') {
      // Chaque mot surgit (rebond) à son instant ; tout le bloc s'efface ensemble à la fin.
      [...el.querySelectorAll('.mot')].forEach((m, k0) => {
        const k = c.numero ? k0 - 1 : k0;
        const p = k < 0 ? (t - c.t0) / .25 : (t - c.mots[k].t) / .2;
        const s = back(p);
        m.style.opacity = clamp(p * 2.5) * ease((c.t1 - t) / .14);
        m.style.transform = `translateY(${(1 - ease(p)) * 40}px) scale(${.7 + .3 * s})`;
      });
    } else if (c.type === 'pilules') {
      [...el.querySelectorAll('.pilule')].forEach((m, k) => {
        const p = (t - c.t0 - k * (c.pas || .22)) / .24;
        m.style.opacity = clamp(p * 3) * ease((c.t1 - t) / .14);
        m.style.transform = `translateY(${(1 - ease(p)) * 30}px) scale(${.6 + .4 * back(p)})`;
      });
    } else if (c.type === 'notif') {
      const n = el.firstChild, p = ease((t - c.t0) / .35), q = ease((c.t1 - t) / .3);
      n.style.transform = `translateY(${(1 - Math.min(p, q)) * -260}px) scale(${.96 + .04 * p})`;
      n.style.opacity = Math.min(p, q);
    } else if (c.type === 'cta') {
      const n = el.firstChild, p = (t - c.t0) / .35;
      const pulse = 1 + .025 * Math.max(0, Math.sin((t - c.t0) * Math.PI * 2 / 1.579 * 2));
      n.style.opacity = v;
      n.style.transform = `translateX(-50%) translateY(${(1 - ease(p)) * 60}px) scale(${pulse})`;
    } else if (c.type === 'flash') {
      el.firstChild.style.opacity = (1 - clamp((t - c.t0) / (c.t1 - c.t0))) * (c.force ?? .85);
    } else if (c.type === 'fin') {
      const f = el.firstChild, d = t - c.t0;
      f.style.opacity = ease(d / .25);
      const logo = f.querySelector('.logo'), halo = f.querySelector('.halo');
      logo.style.transform = `scale(${.6 + .4 * back(d / .5)})`;
      logo.style.opacity = clamp(d / .2);
      halo.style.transform = `scale(${.7 + .3 * ease(d / 1.2) + .03 * Math.sin(d * 2.4)})`;
      const pos = [['.slogan', .35], ['.offre', c.offre_t ?? .9], ['.bouton', c.bouton_t ?? 1.5], ['.url', (c.bouton_t ?? 1.5) + .2]];
      pos.forEach(([s, d0]) => { const e = f.querySelector(s); const p = (d - d0) / .3;
        e.style.opacity = clamp(p * 2); e.style.transform = `translateY(${(1 - ease(p)) * 36}px) scale(${s === '.bouton' ? .85 + .15 * back(p) : 1})`; });
    } else if (c.type === 'chrono') {
      const n = el.firstChild;
      const fige = c.arret ?? 1e9;
      const x = Math.max(0, Math.min(t, fige) - c.depart);
      n.querySelector('.v').textContent = x.toFixed(1).replace('.', ',');
      n.style.opacity = v;
      const fin = t >= fige ? back((t - fige) / .25) : 0;
      n.style.borderColor = t >= fige ? '#1E7A4C' : '';
      n.style.transform = `scale(${1 + .12 * (t >= fige ? Math.max(0, 1 - (t - fige) / .5) : 0)})`;
    } else if (c.type === 'tampon') {
      const n = el.firstChild, p = (t - c.t0) / .3;
      n.style.opacity = clamp(p * 3) * ease((c.t1 - t) / .15);
      n.style.transform = `translateX(-50%) rotate(-6deg) scale(${1.8 - .8 * back(p)})`;
    }
  });
};
</script>
</body>
</html>
