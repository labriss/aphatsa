<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diktéo · le jardin</title>
<style>
/*FONTS*/
html,body{margin:0;background:#050505;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#ui{position:absolute;left:0;bottom:0;width:100%;padding:10px;background:#111;color:#ccc;font:14px sans-serif;display:flex;gap:10px;align-items:center;box-sizing:border-box}
#ui input{flex:1}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="lecture">Lecture</button><input id="curseurUI" type="range" min="0" max="1000" value="0"><span id="temps">0.00</span></div>
<script>
/* Pub 23 « le jardin » : un terrain en terre devient un beau jardin, phrase après phrase (vue de dessus).
   Le paysagiste dicte ; chaque phrase est un vrai geste du chantier, au rythme de la musique (même grille que la pub 12, le peintre).
   85 BPM (1 temps = 0,706 s), 28 temps (19,8 s).
   b0   « PAYSAGISTE ? » à la bombe de traçage sur la terre, b0.75 « Le jardin est fini, le devis pas encore ? »
   b2.7 « Gazon en rouleaux » : quatre rouleaux se déroulent de la haie au massif (le tracé disparaît dessous)
   b6   « 12 arbustes » : plantés deux par deux le long du massif en L
   b10  « Bordure acier » : la bordure se pose en six longueurs, puis le paillage s'étale au râteau
   b14  « Évacuation des déchets verts » : la bâche se replie sur le tas, puis on la tire hors du jardin
   b17.1 les bornes s'allument, l'olivier en pot se pose, la lavande ; on recule : un beau jardin
   b18.6 le total, coup de lumière    b20.6 envoyé à Mme Robin    b22.6 carton */
const W=1080,H=1920,B=60/85,NB=28,DN=NB*B;
const cv=document.getElementById('c');let g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const smooth=x=>(x=clamp(x),x*x*(3-2*x));
function spring(t,w=14,z=.62){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const rnd=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const nz=(x,s=0)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(rnd(i+s*57.3),rnd(i+1+s*57.3),u);};
const O1='#E8650F',O2='#C9480A',O3='#A8350A',ORANGE='#ff8a3d';
function rr(x,y,w,h,r,c=g){c.beginPath();c.roundRect(x,y,w,h,r);}
function texte(t,x,y,size,col,poids=700,font='Archivo',align='center',c=g){c.font=`${poids} ${size}px ${font}`;c.fillStyle=col;c.textAlign=align;c.textBaseline='middle';c.fillText(t,x,y);}
function lueur(col,flou,c=g){c.shadowColor=col;c.shadowBlur=flou;}
function toile(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
// ——— motion design (commun aux pubs 12, 13, 18, 19) ———
// Courbes par rôle : une arrivée se pose sur une longue traîne (expo / power4.out), une sortie accélère (power3.in) et dure moitié moins.
const expoOut=x=>(x=clamp(x),x>=1?1:1-Math.pow(2,-10*x));
const p4Out=x=>1-Math.pow(1-clamp(x),5);
const p3In=x=>Math.pow(clamp(x),3);
// Une ligne qui arrive mot à mot : flou 6 px → net et opacité 0 → 1, sans bouger, 80 ms d'écart ; une fois posée, elle ne bouge plus.
// Elle part en flou, mot à mot, en 0,09 s. Les temps sont en secondes.
function ligneMots(txt,x,y,size,col,poids,font,t,t0,tSortie=1e9,align='center',pas=.08,duree=.16){
  if(t<t0)return;g.save();g.font=`${poids} ${size}px ${font}`;g.textBaseline='middle';g.textAlign='left';g.fillStyle=col;
  const mots=txt.split(' '),esp=g.measureText(' ').width,ls=mots.map(m=>g.measureText(m).width),tot=ls.reduce((a,v)=>a+v,0)+esp*(mots.length-1);
  let xx=align==='center'?x-tot/2:align==='right'?x-tot:x;const a0=g.globalAlpha;
  mots.forEach((m,i)=>{const e=expoOut(seg(t,t0+i*pas,t0+i*pas+duree)),s=p3In(seg(t,tSortie+i*.04,tSortie+i*.04+duree*.55)),a=e*(1-s);
    if(a>.002){g.globalAlpha=a0*a;const fl=6*(1-e)+8*s;g.filter=fl>.2?`blur(${fl.toFixed(1)}px)`:'none';g.fillText(m,xx,y);}xx+=ls[i]+esp;});
  g.restore();}
// Un nom qui arrive lettre par lettre, avec un léger flou.
function lettres(txt,x,y,size,col,poids,font,t,t0,pas=.055,duree=.2){
  if(t<t0)return;g.save();g.font=`${poids} ${size}px ${font}`;g.textBaseline='middle';g.textAlign='left';g.fillStyle=col;const a0=g.globalAlpha;
  for(let i=0;i<txt.length;i++){const e=expoOut(seg(t,t0+i*pas,t0+i*pas+duree));if(e<=.002)continue;g.globalAlpha=a0*e;const fl=5*(1-e);g.filter=fl>.2?`blur(${fl.toFixed(1)}px)`:'none';g.fillText(txt[i],x+g.measureText(txt.slice(0,i)).width,y);}
  g.restore();}
// Le carton de fin (le logo y est déjà arrivé par sa propre transition) : le nom lettre par lettre, la promesse mot à mot,
// puis le bouton qui s'ouvre en largeur depuis son centre (flou horizontal → net). Tout reste immobile une fois posé.
// tf : début du carton (s), k : facteur des délais (pub courte).
function cartonFin(t,tf,k=1,tx=280,ty=700){
  g.save();
  lettres('Diktéo',tx+170,ty+72,138,'#fff',900,'Archivo',t,tf+.05*k);
  const sw=seg(t,tf+.75*k,tf+.75*k+1.1);if(sw>0&&sw<1){g.save();g.globalCompositeOperation='lighter';const x=lerp(330,900,ease(sw));const gl=g.createLinearGradient(x-80,0,x+80,0);gl.addColorStop(0,'rgba(255,255,255,0)');gl.addColorStop(.5,'rgba(255,240,220,.4)');gl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gl;g.fillRect(x-80,ty-10,160,160);g.restore();}
  ligneMots('Tu dictes ton devis, Diktéo l’écrit.',540,940,48,'#f3dccb',600,'Archivo',t,tf+.4*k);
  ligneMots('3 devis offerts par mois · sans carte',540,1060,44,'#fff',700,'Archivo',t,tf+.85*k);
  const kb=p4Out(seg(t,tf+1.3*k,tf+1.3*k+.45));
  if(kb>0){const w=lerp(104,540,kb),fl=10*(1-kb);g.save();g.globalAlpha*=clamp(kb*3);if(fl>.3)g.filter=`blur(${fl.toFixed(1)}px)`;
    const gb=g.createLinearGradient(540-w/2,1150,540+w/2,1254);gb.addColorStop(0,O1);gb.addColorStop(.55,O2);gb.addColorStop(1,O3);g.fillStyle=gb;rr(540-w/2,1150,w,104,lerp(52,34,kb));g.fill();g.restore();
    ligneMots('diktéo.fr',540,1203,46,'#fff',800,'Archivo',t,tf+1.3*k+.18,1e9,'center',.08,.18);}
  g.restore();}
// Flou de mouvement : l'objet est dessiné à plusieurs instants de l'obturation, moyennés (comme une vraie caméra).
// dessin(b) dessine avec le contexte global g ; ouv : ouverture en temps de la pub (même unité que b).
let FM=null;
function flouMouvement(dessin,b,ouv,n=6){
  if(ouv<=1e-4){dessin(b);return;}
  if(!FM)FM=[toile(W,H),toile(W,H)];const [[c1,f1],[c2,f2]]=FM,m=g.getTransform(),g0=g;
  f2.setTransform(1,0,0,1,0,0);f2.globalAlpha=1;f2.globalCompositeOperation='source-over';f2.clearRect(0,0,W,H);
  for(let i=0;i<n;i++){f1.setTransform(1,0,0,1,0,0);f1.globalAlpha=1;f1.filter='none';f1.globalCompositeOperation='source-over';f1.shadowColor='transparent';f1.clearRect(0,0,W,H);f1.setTransform(m);
    g=f1;try{dessin(b-ouv*i/(n-1));}finally{g=g0;}
    f2.globalCompositeOperation='lighter';f2.globalAlpha=1/n;f2.drawImage(c1,0,0);}
  g.save();g.setTransform(1,0,0,1,0,0);g.drawImage(c2,0,0);g.restore();}
let GRAINE=7;const R=()=>{GRAINE=(GRAINE*16807)%2147483647;return GRAINE/2147483647;};
function grain(f,w,h,amp,coul=[1,1,1]){const d=f.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const n=(R()-.5)*amp;p[i]+=n*coul[0];p[i+1]+=n*coul[1];p[i+2]+=n*coul[2];}f.putImageData(d,0,0);}

// ——— le monde, vu de dessus : un terrain de 1280 × 1470 (x de -100 à 1180) ; la haie au-dessus, la margelle et la terrasse en dessous ———
// le gazon : x de 300 à 1180, y de 0 à 1180 ; le massif en L : à gauche (x < 300) et en bas (y > 1180) ; la bordure acier entre les deux.
const MX=-100,MW=1280,MH=1470,SOL=1530,GX=300,GY=1180;
// une étiquette de prix (nom + prix), posée dans l'image, toujours dans la zone sûre TikTok/Reels
let FADE=1;
function etiquette(nom,prix,x,y,b0,b){if(b<b0||FADE<=0)return;const k=expoOut(seg(b,b0,b0+.8)),fl=Math.exp(-(b-b0)*B*4),vieux=b>b0+3?.55:1;
  g.font='700 36px Archivo';const w1=g.measureText(nom).width;g.font='800 46px JBMono';const w2=g.measureText(prix).width,w=w1+w2+76;
  const xmax=(y+40>820&&y-40<1600)?940:1060,cx=clamp(x,w/2+20,xmax-w/2);   // zone sûre : pas sous les boutons de droite
  g.save();g.globalAlpha*=k*vieux*FADE;g.translate(cx,y);g.scale(.92+.08*k,.92+.08*k);if(k<1)g.filter=`blur(${((1-k)*6).toFixed(2)}px)`;
  g.fillStyle='rgba(10,12,16,.88)';rr(-w/2,-40,w,80,28);g.fill();g.strokeStyle=`rgba(255,138,61,${.45+.5*fl})`;g.lineWidth=2.5;rr(-w/2,-40,w,80,28);g.stroke();
  texte(nom,-w/2+26,2,36,'#eef0f2',700,'Archivo','left');lueur(`rgba(255,138,61,${.4+.4*fl})`,16+30*fl);texte(prix,w/2-26,2,46,ORANGE,800,'JBMono','right');g.restore();}

// une feuille (vue de dessus)
function feuille(f,x,y,l,a,col){f.save();f.translate(x,y);f.rotate(a);f.fillStyle=col;f.beginPath();f.moveTo(-l,0);f.quadraticCurveTo(0,-l*.55,l,0);f.quadraticCurveTo(0,l*.55,-l,0);f.fill();f.restore();}
// une branche morte, avec ses rameaux
function branche(f,x,y,a,L,w,s,col){f.save();f.strokeStyle=col;f.lineCap='round';
  const pts=[[x,y]];for(let i=0;i<8;i++){a+=(rnd(s+i)-.5)*.5;x+=Math.cos(a)*L/8;y+=Math.sin(a)*L/8;pts.push([x,y]);}
  f.lineWidth=w;f.beginPath();pts.forEach(([px,py],i)=>i?f.lineTo(px,py):f.moveTo(px,py));f.stroke();
  for(let i=2;i<8;i+=2){const [px,py]=pts[i],aa=a+(rnd(s+i*3)<.5?-1:1)*(.5+rnd(s+i)*.5);f.lineWidth=w*.55;f.beginPath();f.moveTo(px,py);f.lineTo(px+Math.cos(aa)*L*.25,py+Math.sin(aa)*L*.25);f.stroke();}
  f.restore();}

const TERRE=(()=>{const [c,f]=toile(MW,MH);
  const gr=f.createLinearGradient(0,0,0,MH);gr.addColorStop(0,'#3d2c1d');gr.addColorStop(1,'#33251a');f.fillStyle=gr;f.fillRect(0,0,MW,MH);
  // les zones plus sèches, plus humides
  for(let i=0;i<22;i++){const x=R()*MW,y=R()*MH,r=120+R()*320,g2=f.createRadialGradient(x,y,0,x,y,r);const cl=R()<.5;g2.addColorStop(0,cl?'rgba(150,115,80,.12)':'rgba(12,8,4,.25)');g2.addColorStop(1,'rgba(0,0,0,0)');f.fillStyle=g2;f.fillRect(0,0,MW,MH);}
  // les mottes, retournées à la bêche
  for(let i=0;i<1400;i++){const x=R()*MW,y=R()*MH,r=3+R()*11;f.fillStyle=`rgba(${R()<.5?'20,13,7':'120,90,60'},${.25+R()*.35})`;f.beginPath();f.ellipse(x,y,r,r*(.6+R()*.4),R()*3,0,7);f.fill();}
  // les cailloux
  for(let i=0;i<260;i++){const x=R()*MW,y=R()*MH,r=2+R()*6,v=110+R()*60|0;f.fillStyle=`rgb(${v},${v-8},${v-18})`;f.beginPath();f.ellipse(x,y,r,r*.75,R()*3,0,7);f.fill();f.fillStyle='rgba(255,255,255,.18)';f.beginPath();f.arc(x-r*.3,y-r*.3,r*.35,0,7);f.fill();}
  // les ornières de la brouette
  for(const [x0,s] of [[620,3],[880,9]]){f.strokeStyle='rgba(15,9,4,.35)';f.lineWidth=16;f.beginPath();for(let y=0;y<=MH;y+=40){const x=x0+Math.sin(y/300+s)*60;y?f.lineTo(x,y):f.moveTo(x,y);}f.stroke();}
  // les touffes de mauvaises herbes et les brindilles
  for(let i=0;i<70;i++){const x=R()*MW,y=R()*MH;for(let k=0;k<7;k++)feuille(f,x+(R()-.5)*14,y+(R()-.5)*14,6+R()*8,R()*6.28,`rgba(${70+R()*30|0},${85+R()*30|0},${45+R()*20|0},.75)`);}
  for(let i=0;i<40;i++)branche(f,R()*MW,R()*MH,R()*6.28,40+R()*70,2+R()*2,i*7,'rgba(70,48,28,.8)');
  grain(f,MW,MH,18,[1,.85,.7]);return c;})();

function gazon(){const [c,f]=toile(MW,MH);
  const gr=f.createLinearGradient(0,0,0,MH);gr.addColorStop(0,'#4d6e37');gr.addColorStop(1,'#42612f');f.fillStyle=gr;f.fillRect(0,0,MW,MH);
  // les bandes des rouleaux, un ton plus clair un ton plus foncé, et les joints décalés
  for(let j=0;j<4;j++){const x=GX-MX+j*220;f.fillStyle=j%2?'rgba(0,0,0,.06)':'rgba(220,240,190,.04)';f.fillRect(x,0,220,MH);f.fillStyle='rgba(20,30,10,.45)';f.fillRect(x-1,0,3,MH);
    for(let y=(j%2)*110-60;y<MH;y+=230){f.fillStyle='rgba(30,22,12,.4)';f.fillRect(x,y,220,3);}}
  // les brins
  for(let i=0;i<26000;i++){const x=R()*MW,y=R()*MH,l=3+R()*6,a=R()*6.28;f.strokeStyle=`rgba(${R()<.5?'150,185,110':'25,45,15'},${.18+R()*.3})`;f.lineWidth=1;f.beginPath();f.moveTo(x,y);f.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);f.stroke();}
  grain(f,MW,MH,14,[.7,1,.6]);return c;}
function paillage(){const [c,f]=toile(MW,MH);f.fillStyle='#2b1a0f';f.fillRect(0,0,MW,MH);
  for(let i=0;i<9000;i++){const x=R()*MW,y=R()*MH,l=4+R()*12,v=R();f.save();f.translate(x,y);f.rotate(R()*3.14);f.fillStyle=`rgba(${90+v*80|0},${50+v*45|0},${25+v*20|0},${.5+R()*.4})`;f.fillRect(-l/2,-2,l,3+R()*2);f.restore();}
  grain(f,MW,MH,14,[1,.8,.6]);return c;}
function dalles(){const [c,f]=toile(MW,700);f.fillStyle='#2a2622';f.fillRect(0,0,MW,700);
  for(let r=0;r<6;r++){let x=-R()*200;const h=r%2?110:130,y=r*120;while(x<MW){const L=140+R()*160,v=88+R()*30|0;f.fillStyle=`rgb(${v+6},${v},${v-10})`;f.fillRect(x+4,y+4,L-8,h-8);
    for(let k=0;k<30;k++){f.fillStyle=`rgba(${R()<.5?'0,0,0':'255,250,240'},${.04+R()*.06})`;f.beginPath();f.arc(x+R()*L,y+R()*h,2+R()*10,0,7);f.fill();}x+=L;}}
  grain(f,MW,700,12);return c;}
function bache(){const [c,f]=toile(MW,700);f.fillStyle='#3e4a3d';f.fillRect(0,0,MW,700);
  for(let i=0;i<60;i++){const x=R()*MW,y=R()*700,w=60+R()*260,h=20+R()*70;const gr=f.createLinearGradient(x,y,x+w*.3,y+h);gr.addColorStop(0,`rgba(220,235,220,${.04+R()*.1})`);gr.addColorStop(1,'rgba(0,0,0,.14)');f.fillStyle=gr;f.beginPath();f.ellipse(x,y,w,h,R()*3,0,7);f.fill();}
  // le tas de déchets verts : branches, feuilles mortes, herbes arrachées
  for(const [cx,cy,rx,ry] of [[330,250,330,170],[860,320,300,200]]){
    const ga=f.createRadialGradient(cx,cy,0,cx,cy,rx);ga.addColorStop(0,'rgba(0,0,0,.45)');ga.addColorStop(1,'rgba(0,0,0,0)');f.fillStyle=ga;f.fillRect(cx-rx*1.2,cy-ry*1.6,rx*2.4,ry*3.2);
    for(let i=0;i<900;i++){const a=R()*6.28,d=Math.sqrt(R());const x=cx+Math.cos(a)*rx*d,y=cy+Math.sin(a)*ry*d,v=R();
      feuille(f,x,y,6+R()*12,R()*6.28,v<.45?`rgb(${95+R()*40|0},${70+R()*30|0},${35+R()*20|0})`:v<.8?`rgb(${55+R()*30|0},${78+R()*30|0},${38+R()*20|0})`:`rgb(${140+R()*40|0},${110+R()*30|0},${60})`);}
    for(let i=0;i<40;i++){const a=R()*6.28,d=Math.sqrt(R())*.8;branche(f,cx+Math.cos(a)*rx*d,cy+Math.sin(a)*ry*d,R()*6.28,60+R()*120,3+R()*4,i*13+cx,`rgb(${70+R()*40|0},${48+R()*25|0},${28})`);}}
  grain(f,MW,700,12);return c;}
function haie(){const [c,f]=toile(MW+400,700);f.fillStyle='#15210f';f.fillRect(0,0,MW+400,700);
  for(let i=0;i<5000;i++){const x=R()*(MW+400),y=R()*700,v=R()*(y/700);feuille(f,x,y,8+R()*10,R()*6.28,`rgb(${25+v*45|0},${40+v*55|0},${20+v*25|0})`);}
  const gb=f.createLinearGradient(0,600,0,700);gb.addColorStop(0,'rgba(0,0,0,0)');gb.addColorStop(1,'rgba(0,0,0,.6)');f.fillStyle=gb;f.fillRect(0,600,MW+400,100);return c;}
// un arbuste vu de dessus, dessiné une fois : trois variétés (feuillage rond, persistant foncé, gris argenté)
function arbuste(i){const [c,f]=toile(200,200),v=i%3,s=i*17+3;f.translate(100,100);
  const pal=[['#1f3a1a','#36592b','#5f8445'],['#14271a','#24412b','#3f6a45'],['#2e3a2c','#55654f','#8a9a80']][v];
  for(let k=0;k<3;k++){const n=[260,180,90][k];for(let j=0;j<n;j++){const a=rnd(s+j*1.3+k*99)*6.28,d=Math.sqrt(rnd(s+j*2.7+k*77))*(70-k*16);const x=Math.cos(a)*d-k*8,y=Math.sin(a)*d-k*8;
      feuille(f,x,y,(v===1?5:8)+rnd(s+j)*6,v===1?a:rnd(s+j*5)*6.28,pal[k]);}}
  if(v===2)for(let j=0;j<14;j++){const a=rnd(s+j*9)*6.28,d=20+rnd(s+j*4)*40;f.fillStyle='rgba(230,225,215,.55)';f.beginPath();f.arc(Math.cos(a)*d,Math.sin(a)*d,3,0,7);f.fill();}
  return c;}
// les 12 arbustes : cinq à gauche, un dans l'angle, six en bas (plantés deux par deux le long du L)
const ARB=[[170,140],[170,370],[170,600],[170,830],[170,1060],[170,1330],[400,1330],[530,1330],[660,1330],[790,1330],[920,1330],[1050,1330]];
let TEX=null;
function preparer(){if(TEX)return;
  TEX={gazon:gazon(),paille:paillage(),dalles:dalles(),bache:bache(),haie:haie(),arb:ARB.map((_,i)=>arbuste(i))};}

// le rouleau de gazon, vu de dessus : un cylindre couché qui se déroule vers le bas
function rouleauGazon(x0,x1,y,r){g.save();
  g.save();g.globalAlpha=.55;g.filter='blur(12px)';g.fillStyle='#000';g.fillRect(x0+6,y-r+14,x1-x0,r*2+10);g.restore();
  const gr=g.createLinearGradient(0,y-r,0,y+r);gr.addColorStop(0,'#3a2a1a');gr.addColorStop(.25,'#5b4630');gr.addColorStop(.42,'#4f6f38');gr.addColorStop(.6,'#7a9a58');gr.addColorStop(1,'#2d4520');

// la bordure acier, tracée le long du L, de (GX,0) à (GX,GY) puis jusqu'à (1180,GY)

    {const r2=seg(b,.75,1.25);if(r2>0){g.save();g.beginPath();g.rect(-560,210,1120*r2,260);g.clip();let f2=74;g.font=`800 ${f2}px Archivo`;

// ——— un seul élément du début à la fin : le rond orange du micro ———
// il s'ouvre en bandeau pour chaque phrase, se referme en rond, devient le cartouche du total, la coche de l'envoi,
// puis glisse et grandit pour devenir le carré du logo Diktéo (transition par forme commune, jamais de coupe)
const FENETRES=[[2.7,9.2,'big'],[10,13.5,'big'],[14,17.0,'big'],[B_TOT,B_FIN-.55,'tot']];
const GEO={big:[60,166,960,200,44],tot:[90,171,900,230,52]};
function ouvert(b){let k=0,typ='big';for(const [a,e,t] of FENETRES){const v=spring(Math.max(0,(b-a))*B,13,.78)*(1-ease(seg(b,e,e+.4)));if(b>=a&&v>k){k=v;typ=t;}if(b>=a&&b<e+.4)typ=t;}return [clamp(k,0,1.04),typ];}
function boite(b){
  if(b<2.3)return;
  const app=easeOut(seg(b,2.3,2.65));
  const [k,typ]=ouvert(b);
  // le rond : au fil de la pub il reste à gauche ; à la fin il devient le logo
  const m=ease(seg(b,B_FIN-.5,B_FIN+.35));
  const dS=lerp(92,140,m),dR=lerp(46,40,m),dx=lerp(150,280+70,m),dy=lerp(266,700+70,m)+(1-app)*-40;
  // la boîte sombre qui s'ouvre autour du rond

    g.save();g.globalAlpha=app*(1-m);g.fillStyle='rgba(14,8,4,.86)';rr(x,y,w,h,r);g.fill();g.strokeStyle=`rgba(255,138,61,${.25*clamp(k)})`;g.lineWidth=2;rr(x,y,w,h,r);g.stroke();g.restore();}
  // le rond orange
  g.save();g.globalAlpha=app;const gm=g.createLinearGradient(dx-dS/2,dy-dS/2,dx+dS/2,dy+dS/2);gm.addColorStop(0,O1);gm.addColorStop(.55,O2);gm.addColorStop(1,O3);
  if(m>0)lueur('rgba(232,101,15,.5)',50*m);g.fillStyle=gm;rr(dx-dS/2,dy-dS/2,dS,dS,dR);g.fill();g.shadowColor='transparent';
  // l'icône dans le rond : micro, puis coche à l'envoi, puis la bulle Diktéo
  const ic=seg(b,B_ENV,B_ENV+.25),lg=seg(b,B_FIN-.25,B_FIN+.2);
