<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diktéo · la canicule</title>
<style>
/*FONTS*/
html,body{margin:0;background:#050505;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#ui{position:absolute;left:0;bottom:0;width:100%;padding:10px;background:#111;color:#ccc;font:14px sans-serif;display:flex;gap:10px;align-items:center;box-sizing:border-box}
#ui input{flex:1}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="lecture">Lecture</button><input id="curseurUI" type="range" min="0" max="1000" value="0"><span id="temps">0.00</span></div>
<script>
/* Pub 21 « la canicule » : pour les climaticiens. Un séjour en pleine canicule, le soleil qui tape, 35° au thermomètre.
   Chaque phrase dictée installe le vrai matériel : le climatiseur mural, la liaison frigorifique, l'unité extérieure
   sur son support, la télécommande ; la chaleur retombe, l'air frais souffle, le thermomètre redescend à 24°.
   b0 « CLIMATICIEN ? » balayé dans l'éblouissement d'une vitre + « Encore un devis à chiffrer en pleine canicule ? »
   b4 recul : le séjour brûlant   b5…14 les quatre lignes   b16.6 la clim démarre : 24°, le total   b20.4 envoi   b24.4 carton */
const W=1080,H=1920,BPM=129.2,B=60/BPM,NB=31,DN=NB*B;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
function spring(t,w=14,z=.62){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const rnd=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const O1='#E8650F',O2='#C9480A',O3='#A8350A',ORANGE='#ff8a3d';
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function texte(t,x,y,size,col,poids=700,font='Archivo',align='center'){g.font=`${poids} ${size}px ${font}`;g.fillStyle=col;g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y);}
function lueur(col,flou){g.shadowColor=col;g.shadowBlur=flou;}
// motion design : arrivée à longue traîne, sans rebond ; mots qui passent du flou au net puis ne bougent plus
const expoOut=x=>(x=clamp(x),x>=1?1:1-Math.pow(2,-10*x));
function motsFlous(t,x,y,size,col,poids,font,align,b,b0,ec=.2,du=.5){g.font=`${poids} ${size}px ${font}`;const ws=t.split(' '),sp=g.measureText(' ').width,wd=ws.map(w=>g.measureText(w).width),L=wd.reduce((a,c)=>a+c,0)+sp*(ws.length-1);
  let cx=align==='center'?x-L/2:align==='right'?x-L:x;ws.forEach((w,i)=>{const k=expoOut(seg(b,b0+i*ec,b0+i*ec+du));if(k>0){g.save();g.globalAlpha*=k;if(k<1)g.filter=`blur(${((1-k)*8).toFixed(2)}px)`;texte(w,cx,y,size,col,poids,font,'left');g.restore();}cx+=wd[i]+sp;});}
const mix=(c1,c2,k)=>`rgb(${c1.map((v,i)=>Math.round(lerp(v,c2[i],k))).join(',')})`;

const ITEMS=[
  {b:5, dit:'« Clim réversible 3,5 kilowatts,', dit2:'1 290 euros. »'},
  {b:8, dit:'« Liaison frigo, six mètres,', dit2:'35 euros le mètre. »'},
  {b:11, dit:'« Support mural extérieur,', dit2:'85 euros. »'},
  {b:14,dit:'« Mise en service,', dit2:'190 euros. »'},
];
const T_CH=5.3, T_RAD=8.3, T_TH=11.3, T_MO=14.3, B_ON=16.6, B_ENV=20.4, B_TXT=21.2, B_FIN=24.4;
// 1 290 + 6 × 35 + 85 + 190 = 1 775 € HT ; TVA 10 % : 177,50 € ; TTC 1 952,50 €
const TOTAL=1952.5;
// la fraîcheur de la pièce, de 0 (canicule, 35°) à 1 (24°)
const fraicheur=b=>.1*ease(seg(b,T_CH+.5,T_CH+1.5))+.1*ease(seg(b,T_RAD+.4,T_RAD+1.6))+.1*ease(seg(b,T_TH+.4,T_TH+1.2))+.7*ease(seg(b,B_ON,B_ON+2.6));
// la pièce
const FEN={x:590,y:520,w:380,h:520};            // la fenêtre (dehors : le soleil qui tape)
const CLIM={x:100,y:590,w:420,h:150};           // le climatiseur mural (unité intérieure)
const EXT={x:640,y:830,w:290,h:160};            // l'unité extérieure, vue par la fenêtre, sur son support
const THERMO={x:200,y:1010,r:66};               // le thermomètre du séjour
const TELE={x:200,y:1250};                      // la télécommande au mur
const SOL=1480;

// la chaleur sur les bords de l'écran : un voile orange qui vibre, calculé une fois
const CHALEUR=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const f=c.getContext('2d');
  const gr=f.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);gr.addColorStop(0,'rgba(255,150,60,0)');gr.addColorStop(.6,'rgba(255,130,40,.14)');gr.addColorStop(1,'rgba(255,110,30,.42)');f.fillStyle=gr;f.fillRect(0,0,W,H);
  const gs=f.createRadialGradient(W*.9,0,0,W*.9,0,900);gs.addColorStop(0,'rgba(255,230,170,.35)');gs.addColorStop(1,'rgba(255,200,120,0)');f.fillStyle=gs;f.fillRect(0,0,W,H);
  return c;})();
// la vitre brûlée de soleil, pour l'accroche : un éblouissement blanc-orangé
const VITRE=(()=>{const c=document.createElement('canvas');c.width=FEN.w*3;c.height=FEN.h*3;const f=c.getContext('2d');
  const gr=f.createLinearGradient(0,0,c.width,c.height);gr.addColorStop(0,'rgba(255,236,190,.95)');gr.addColorStop(.5,'rgba(255,196,120,.92)');gr.addColorStop(1,'rgba(240,150,70,.9)');f.fillStyle=gr;f.fillRect(0,0,c.width,c.height);
  const gs=f.createRadialGradient(c.width*.8,c.height*.12,10,c.width*.8,c.height*.12,c.width*.7);gs.addColorStop(0,'rgba(255,255,240,.95)');gs.addColorStop(1,'rgba(255,220,160,0)');f.fillStyle=gs;f.fillRect(0,0,c.width,c.height);
  let s=5;const R=()=>(s=(s*16807)%2147483647)/2147483647;f.strokeStyle='rgba(255,255,235,.35)';f.lineCap='round';
  for(let i=0;i<26;i++){const x=R()*c.width*1.4-c.width*.2;f.lineWidth=6+R()*30;f.beginPath();f.moveTo(x,0);f.lineTo(x-c.height*.5,c.height);f.stroke();}
  return c;})();
const SCRATCH=document.createElement('canvas');SCRATCH.width=VITRE.width;SCRATCH.height=VITRE.height;const sg=SCRATCH.getContext('2d');
function etincelles(x,y,seed,t,force=1,col=[255,200,140]){if(t<0||t>1)return;g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<22*force;i++){const a=rnd(seed+i*7)*Math.PI*2,v=(60+rnd(seed+i*3)*260)*force,px=x+Math.cos(a)*v*t,py=y+Math.sin(a)*v*t+t*t*200;
    g.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${1-t})`;g.beginPath();g.arc(px,py,3*(1-t)+.8,0,7);g.fill();}g.restore();}
let FADE=1;
function etiquette(nom,prix,x,y,b0,b,extra){if(b<b0||FADE<=0)return;const k=expoOut(seg(b,b0,b0+1.1)),fl=Math.exp(-(b-b0)*B*4),vieux=b>b0+2.2?.55:1;
  g.font='700 36px Archivo';const w1=g.measureText(nom).width;g.font='800 46px JBMono';const w2=g.measureText(prix).width,w=w1+w2+76;
  const xmax=(y+40>820&&y-40<1600)?940:1060,cx=clamp(x,w/2+20,xmax-w/2);   // zone sûre : pas sous les boutons de droite
  g.save();g.globalAlpha*=clamp(k*1.4)*vieux*FADE;if(k<1)g.filter=`blur(${((1-k)*8).toFixed(2)}px)`;g.translate(cx,y+(1-k)*14);g.scale(.94+.06*k,.94+.06*k);
  g.fillStyle='rgba(12,10,8,.88)';rr(-w/2,-40,w,80,28);g.fill();g.strokeStyle=`rgba(255,138,61,${.45+.5*fl})`;g.lineWidth=2.5;rr(-w/2,-40,w,80,28);g.stroke();
  texte(nom,-w/2+26,2,36,'#f3ece2',700,'Archivo','left');lueur(`rgba(255,138,61,${.4+.4*fl})`,16+30*fl);texte(prix,w/2-26,2,46,ORANGE,800,'JBMono','right');
  if(extra){g.shadowBlur=0;extra(w);}g.restore();}
// la dictée en direct : « TU DICTES », les mots s'écrivent au rythme de la voix, curseur, micro qui pulse
function dictee(it,b,mx,my,tx,y0,size){
  const L1=it.dit.length,L2=it.dit2.length,u=seg(b,it.b+.05,it.b+2),n=Math.floor(u*(L1+L2));
  const s1=it.dit.slice(0,Math.min(n,L1)),s2=it.dit2.slice(0,Math.max(0,n-L1));
  texte('TU DICTES',tx,y0-2,30,ORANGE,900,'Archivo','left');
  texte(s1,tx,y0+54,size,'#fff',700,'Archivo','left');if(s2)texte(s2,tx,y0+54+size*1.3,size,ORANGE,700,'Archivo','left');
  if(u<1||Math.floor(b*3)%2===0){g.font=`700 ${size}px Archivo`;const yy=s2?y0+54+size*1.3:y0+54,ww=g.measureText(s2||s1).width;g.fillStyle=s2?ORANGE:'#fff';g.fillRect(tx+ww+6,yy-size*.45,4,size*.9);}
  if(u<1){g.save();g.globalCompositeOperation='lighter';for(let k=0;k<2;k++){const ph=((b-it.b)*1.6+k*.5)%1;g.strokeStyle=`rgba(255,138,61,${.7*(1-ph)})`;g.lineWidth=3;g.beginPath();g.arc(mx,my,46+ph*36,0,7);g.stroke();}g.restore();}
}

// ——— les objets ———
const BLEU='#7fd0ff';
function flocon(x,y,r,col,lw=3){g.save();g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.translate(x,y);
  for(let i=0;i<3;i++){g.rotate(Math.PI/3);g.beginPath();g.moveTo(-r,0);g.lineTo(r,0);g.moveTo(r*.55,0);g.lineTo(r*.8,-r*.22);g.moveTo(r*.55,0);g.lineTo(r*.8,r*.22);g.moveTo(-r*.55,0);g.lineTo(-r*.8,-r*.22);g.moveTo(-r*.55,0);g.lineTo(-r*.8,r*.22);g.stroke();}g.restore();}
function climInt(k,on,t){if(k<=0)return;const {x,y,w,h}=CLIM;g.save();g.globalAlpha*=clamp(k*2);g.translate(0,(1-k)*-60);
  g.fillStyle='rgba(0,0,0,.35)';rr(x+10,y+16,w,h,30);g.fill();
  const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#f6f4f0');gr.addColorStop(.6,'#e4e1db');gr.addColorStop(1,'#c9c5bd');g.fillStyle=gr;rr(x,y,w,h,30);g.fill();
  g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x+24,y+44,w-48,3);
  texte('INVERTER',x+40,y+82,18,'#9a958c',800,'Archivo','left');
  // l'afficheur : la consigne en bleu quand la clim tourne
  g.fillStyle='#1a1d20';rr(x+w-150,y+58,104,46,10);g.fill();
  if(on>0){g.save();lueur('rgba(127,208,255,.9)',14);texte(`${Math.round(lerp(35,24,on))}°`,x+w-98,y+82,30,BLEU,800,'JBMono');g.restore();}
  // le volet qui s'ouvre
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+30,y+h-26,w-60,10+14*on);g.fillStyle='#d4d0c8';rr(x+30,y+h-18+12*on,w-60,12,6);g.fill();
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+30,y+h-26,w-60,4);
  g.restore();}
// le souffle frais qui descend dans la pièce
function souffle(on,t){if(on<=0)return;const {x,y,w,h}=CLIM;g.save();g.globalCompositeOperation='lighter';g.lineCap='round';
  for(let i=0;i<7;i++){const bx=x+50+i*(w-100)/6;g.strokeStyle=`rgba(140,210,255,${.32*on})`;g.lineWidth=4;g.beginPath();
    for(let s=0;s<=24;s++){const L=s/24,yy=y+h+10+L*520*on,xx=bx+L*170+Math.sin(t*4-s*.45+i)*14*L;s?g.lineTo(xx,yy):g.moveTo(xx,yy);}g.stroke();}
  for(let i=0;i<14;i++){const ph=(t*.5+rnd(i*3.3))%1,px=x+60+rnd(i*1.7)*(w-120)+ph*190,py=y+h+20+ph*560*on;flocon(px,py,7+rnd(i)*5,`rgba(200,236,255,${.6*on*(1-ph)})`,2);}
  g.restore();}
function climExt(k,on,t){if(k<=0)return;const {x,y,w,h}=EXT;
  // le support mural : deux équerres sous l'unité
  g.save();g.globalAlpha*=clamp(k*2);g.strokeStyle='#3b3f44';g.lineWidth=10;g.lineCap='round';g.lineJoin='round';
  for(const ex of [x+40,x+w-40]){g.beginPath();g.moveTo(ex,y+h+4);g.lineTo(ex,y+h+46);g.moveTo(ex-30,y+h+4);g.lineTo(ex+30,y+h+4);g.moveTo(ex,y+h+40);g.lineTo(ex+26,y+h+6);g.stroke();}
  g.restore();
  g.save();g.globalAlpha*=clamp(k*2);const sy=.6+.4*clamp(k);g.translate(x+w/2,y+h);g.scale(1,sy);g.translate(-x-w/2,-y-h);
  g.fillStyle='rgba(0,0,0,.3)';rr(x+8,y+12,w,h,14);g.fill();
  const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#d9d6cf');gr.addColorStop(.5,'#f0ede7');gr.addColorStop(1,'#c3bfb7');g.fillStyle=gr;rr(x,y,w,h,14);g.fill();
  // la grille du ventilateur, qui tourne quand la clim démarre
  const cx=x+100,cy=y+h/2,r=62;g.fillStyle='#2a2d31';g.beginPath();g.arc(cx,cy,r,0,7);g.fill();
  g.save();g.translate(cx,cy);g.rotate(t*18*on);g.fillStyle='#5b6067';for(let i=0;i<3;i++){g.rotate(Math.PI*2/3);g.beginPath();g.ellipse(0,-28,14,28,.4,0,7);g.fill();}g.restore();
  g.strokeStyle='rgba(220,220,220,.5)';g.lineWidth=2;for(let rr2=18;rr2<r;rr2+=14){g.beginPath();g.arc(cx,cy,rr2,0,7);g.stroke();}
  g.fillStyle='rgba(0,0,0,.12)';for(let i=0;i<6;i++)g.fillRect(x+190,y+28+i*20,76,4);
  g.restore();}
function thermometre(temp,b){const {x,y,r}=THERMO;g.save();g.translate(x,y);
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.arc(6,10,r,0,7);g.fill();
  const gr=g.createRadialGradient(-20,-20,5,0,0,r);gr.addColorStop(0,'#f2efe9');gr.addColorStop(1,'#bdb8ae');g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();
  g.fillStyle='#16191c';g.beginPath();g.arc(0,0,r*.74,0,7);g.fill();
  const u=clamp((temp-22)/13),chaud=u>.4;g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=7;g.beginPath();g.arc(0,0,r*.6,Math.PI*.75,Math.PI*2.25);g.stroke();
  g.strokeStyle=chaud?'#ff5a2a':BLEU;g.lineCap='round';g.beginPath();g.arc(0,0,r*.6,Math.PI*.75,Math.PI*(.75+1.5*u));g.stroke();
  lueur(chaud?'rgba(255,90,42,.8)':'rgba(127,208,255,.7)',12);texte(`${temp.toFixed(0)}°`,0,2,40,chaud?'#ffc2a8':'#d4efff',800,'JBMono');g.restore();}
function telecommande(k,on,b){if(k<=0)return;const {x,y}=TELE;g.save();g.translate(x,y);g.scale(clamp(k,0,1.1),clamp(k,0,1.1));
  g.fillStyle='rgba(0,0,0,.4)';rr(-50,-84,108,176,22);g.fill();g.fillStyle='#ece9e3';rr(-54,-90,108,176,22);g.fill();
  g.fillStyle='#1a1d20';rr(-38,-72,76,52,8);g.fill();
  const pret=b>=T_MO+.8;if(pret){lueur('rgba(127,208,255,.8)',10);flocon(-14,-46,11,BLEU,2.5);texte('OK',14,-45,18,BLEU,900,'Archivo');g.shadowBlur=0;}
  g.fillStyle=pret?O1:'#c9c5bd';g.beginPath();g.arc(0,16,16,0,7);g.fill();
  g.fillStyle='#c9c5bd';for(let i=0;i<2;i++)for(let j=0;j<2;j++){rr(-34+j*44,44+i*22,24,12,6);g.fill();}
  g.restore();}

function salon(b,t,h,kExt,on){
  // le mur : chaud orangé en pleine canicule, qui se rafraîchit en bleu-gris
  const gm=g.createLinearGradient(0,0,0,SOL);gm.addColorStop(0,mix([74,44,26],[30,40,52],h));gm.addColorStop(1,mix([92,56,32],[40,52,64],h));g.fillStyle=gm;g.fillRect(-400,-600,W+800,SOL+600);
  // la plinthe et le parquet
  const gs=g.createLinearGradient(0,SOL,0,H+400);gs.addColorStop(0,mix([110,70,40],[70,64,62],h));gs.addColorStop(1,mix([52,32,20],[26,26,30],h));g.fillStyle=gs;g.fillRect(-400,SOL,W+800,800);
  g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=3;for(let y=SOL+60;y<H+400;y+=70){g.beginPath();g.moveTo(-400,y);g.lineTo(W+400,y);g.stroke();}
  g.fillStyle=mix([140,100,70],[96,104,114],h);g.fillRect(-400,SOL-24,W+800,24);
  // la fenêtre : plein soleil d'été, les toits qui ondulent dans la chaleur
  const {x,y,w,h:fh}=FEN;const gc=g.createLinearGradient(0,y,0,y+fh);gc.addColorStop(0,'#ffcf7a');gc.addColorStop(.55,'#ffe6b0');gc.addColorStop(1,'#f3b36a');g.fillStyle=gc;g.fillRect(x,y,w,fh);
  g.save();g.beginPath();g.rect(x,y,w,fh);g.clip();
  const gsun=g.createRadialGradient(x+w*.72,y+110,10,x+w*.72,y+110,200);gsun.addColorStop(0,'rgba(255,255,240,1)');gsun.addColorStop(.25,'rgba(255,240,190,.9)');gsun.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gsun;g.fillRect(x,y,w,fh);
  g.fillStyle='#fffdf2';g.beginPath();g.arc(x+w*.72,y+110,44,0,7);g.fill();
  g.fillStyle='#c98450';g.beginPath();g.moveTo(x,y+fh);for(let i=0;i<=12;i++){const xx=x+i*w/12,yy=y+fh-150-(i%3?30:70)+Math.sin(t*5+i)*2;g.lineTo(xx,yy);}g.lineTo(x+w,y+fh);g.fill();
  g.fillStyle='#a8683f';g.fillRect(x,y+fh-50,w,50);
  climExt(kExt,on,t);
  g.restore();
  // la vitre éblouie de soleil : l'éclat baisse quand la pièce se rafraîchit
  g.save();g.globalAlpha=.55*(1-h);g.drawImage(VITRE,x,y,w,fh);g.restore();
  g.strokeStyle=mix([214,196,170],[200,204,210],h);g.lineWidth=22;g.strokeRect(x,y,w,fh);g.lineWidth=12;g.beginPath();g.moveTo(x+w/2,y);g.lineTo(x+w/2,y+fh);g.stroke();
  // le rayon de soleil qui tape sur le parquet
  g.save();g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,190,110,${.13*(1-.7*h)})`;g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.lineTo(x+w-200,SOL+300);g.lineTo(x-420,SOL+300);g.closePath();g.fill();g.restore();
  // un fauteuil, pour lire le séjour
  g.fillStyle='rgba(0,0,0,.3)';rr(400,1290,170,180,24);g.fill();rr(390,1360,190,110,20);g.fill();
  // l'air brûlant qui ondule au-dessus du parquet
  if(h<.95){g.save();g.globalCompositeOperation='lighter';g.strokeStyle=`rgba(255,170,90,${.2*(1-h)})`;g.lineWidth=3;
    for(let i=0;i<8;i++){const bx=60+i*135;g.beginPath();for(let s=0;s<=22;s++){const yy=SOL-10-s*12,xx=bx+Math.sin(t*3+s*.5+i)*9;s?g.lineTo(xx,yy):g.moveTo(xx,yy);}g.stroke();}g.restore();}
}

function seek(T){
  const t=((T%DN)+DN)%DN,b=t/B;
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.shadowBlur=0;g.setLineDash([]);g.filter='none';   // tout remettre à zéro à chaque image
  g.fillStyle='#050505';g.fillRect(0,0,W,H);
  const h=fraicheur(b),on=ease(seg(b,B_ON,B_ON+2));
  // la caméra : collée à la vitre brûlante, puis recul sur le séjour
