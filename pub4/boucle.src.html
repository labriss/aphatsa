<script>
/* Feuille de temps, en temps de musique (123 BPM, 1 temps = 0,488 s). Une seule chose à lire à la fois :
   la bille saute de mot en mot (karaoké), chaque mot s'allume quand elle s'y pose ; les écrans n'ont pas de texte.
  0 1 2   « Encore » « un devis » « ce soir ? »      pops
  3       la bille tombe sur le document qui se tape lentement (la corvée)      choc doux
  4→6     chute vers « Dites-le. » (6)                pop
  7       elle enfonce le micro : il s'allume, l'onde part (7→9)                 clic
  9→11    chute vers « Diktéo » (11) « écrit » (12) « le devis. » (13)
  14      sur le devis : trois lignes s'écrivent (14, 14.5, 15)                 blips
  16→18   elle roule sur la piste, le total monte à 872,30 €                  tics
  18→20   chute vers « Le client » (20) « signe. » (21)
  22→23   elle signe ; 24 elle appuie sur ✓ (vert)                              ding
  24→26   chute vers « Facture » (26) « prête. » (27) ; 28 badge ✓             cloche
  29      elle s'envole ; recul : tout le parcours ; « Ce soir, vous êtes libre. » (30.5→35.2)  whoosh
  35.6    carton Diktéo (→41.6)                                                 pop
  41.8→46 plongée sur « Encore » = 0                                           whoosh */
function spring(t,w=14,z=.82){if(t<=0)return 0;if(z>=1)return 1-Math.exp(-w*t)*(1+w*t);const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const kf=keys=>t=>{if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){const[a,va]=keys[i-1],[b,vb,e=ease]=keys[i];if(t<=b)return lerp(va,vb,e((t-a)/(b-a)));}return keys[keys.length-1][1];};
const rng=s=>()=>(s=(s+0x6D2B79F5)|0,s=Math.imul(s^(s>>>15),1|s),s^=s+Math.imul(s^(s>>>7),61|s),((s^(s>>>14))>>>0)/4294967296);
const $=id=>document.getElementById(id);

const B=60/123, NB=50, DN=NB*B, G=6000, R=28;
window.VIDEO={w:1080,h:1920,duration:DN};
const O=[[0,1600],[0,3000],[0,4400],[0,7200],[0,8600],[0,5800]]; // une colonne ; 5 = l'envoi (entre 2 et 3) ; le carton est au-dessus (y < 1500)
const at=(s,x,y)=>[O[s][0]+x,O[s][1]+y];

// ——— les mots : position de la bille posée dessus, temps (beat) où elle s'y pose ———
const MOTS=[
  [0,'Encore',330,200,0],[0,'un devis',560,350,1],[0,'ce soir ?',700,500,2,1],
  [1,'Dites-le.',540,300,6,1],
  [2,'Diktéo',330,200,11],[2,'écrit',560,350,12],[2,'le devis.',700,500,13,1],
  [5,'Un clic,',340,220,20],[5,"c'est envoyé.",590,370,21,1],
  [3,'Le client',360,220,25],[3,'signe.',650,370,26,1],
  [4,'Facture',360,220,31],[4,'prête.',650,370,32,1]];
const DEB=[0,6,11,25,31,20];
const W=$('world'), mk=(css)=>{const e=document.createElement('div');e.style.cssText='position:absolute;left:0;top:0;pointer-events:none;'+css;W.appendChild(e);return e;};
// la voix devient les lignes du devis : trois traits orange quittent le micro et se posent dans le devis
const MIC=[540,O[1][1]+820], LIGNES=[[220,O[2][1]+680,330],[220,O[2][1]+740,260],[220,O[2][1]+800,300]];
const traits=LIGNES.map(()=>mk('height:22px;border-radius:11px;background:linear-gradient(90deg,#E8650F,#FF9A4A);box-shadow:0 0 24px rgba(232,101,15,.6)'));
// ondes autour du micro
const ondes=[0,1,2].map(()=>mk('width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;border:4px solid #E8650F'));
// petites explosions : étincelles sur le total, confettis sur ✓, onde de choc sur la facture
const EXPL=[{x:600,y:O[2][1]+890,a:18,n:26,cols:['#FF9A4A','#FFE2C4','#E8650F'],w:14,h:14,v:[500,1100],ang:[-170,-10],g:1500,dur:0.9,rond:1},
  {x:538,y:O[3][1]+966,a:29,n:40,cols:['#2FAE6C','#FF9A4A','#E7EDEA','#7BE0A8'],w:20,h:11,v:[800,1600],ang:[-165,-15],g:2600,dur:1.3},
  {x:740,y:O[4][1]+1010,a:33,n:22,cols:['#2FAE6C','#FFE2C4','#7BE0A8'],w:14,h:14,v:[450,900],ang:[-180,0],g:900,dur:0.8,rond:1}];
const parts=[];EXPL.forEach((E,k)=>{const r=rng(31+k);for(let i=0;i<E.n;i++){const an=(E.ang[0]+r()*(E.ang[1]-E.ang[0]))*Math.PI/180,sp=lerp(E.v[0],E.v[1],r());
  parts.push({E,el:mk(`width:${E.w}px;height:${E.h}px;margin:${-E.h/2}px 0 0 ${-E.w/2}px;border-radius:${E.rond?'50%':'2px'};background:${E.cols[i%E.cols.length]}`),vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,rot:(r()-.5)*1400,d:r()*0.08});}});
const choc=mk('width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;border:6px solid #2FAE6C');
const motEl=MOTS.map(([s,txt,x,y,b,cle],i)=>{const e=document.createElement('div');e.className='mot';e.textContent=txt;
  e.style.left=(O[s][0]+x)+'px';e.style.top=(O[s][1]+y+R-22)+'px';e.style.transform='translateX(-50%)';$('world').appendChild(e);return e;});

// ——— le parcours de la bille (en temps de musique) ———
const P={doc:at(0,540,632), mic:at(1,540,672), carte:at(2,540,612), p0:at(2,230,972), p1:at(2,850,972),
  sig0:at(3,430,790), sig1:at(3,650,790), ok:at(3,540,890), fact:at(4,540,592), env:at(5,540,632)};
const M=MOTS.map(m=>at(m[0],m[2],m[3]));
const S=[];const hop=(a,b,p0,p1)=>S.push({a,b,type:'hop',p0,p1}),hold=(a,b,p)=>S.push({a,b,type:'hold',p0:p,p1:p}),roll=(a,b,p0,p1)=>S.push({a,b,type:'roll',p0,p1});
hop(0,1,M[0],M[1]); hop(1,2,M[1],M[2]); hop(2,3,M[2],P.doc); hold(3,4,P.doc);
hop(4,6,P.doc,M[3]); hop(6,7,M[3],P.mic); hold(7,9,P.mic);
hop(9,11,P.mic,M[4]); hop(11,12,M[4],M[5]); hop(12,13,M[5],M[6]); hop(13,14,M[6],P.carte); hold(14,15,P.carte); hop(15,16,P.carte,P.p0); roll(16,18,P.p0,P.p1);
hop(18,20,P.p1,M[7]); hop(20,21,M[7],M[8]); hop(21,22,M[8],P.env); hold(22,23,P.env);
hop(23,25,P.env,M[9]); hop(25,26,M[9],M[10]); hop(26,27,M[10],P.sig0); roll(27,28,P.sig0,P.sig1); hop(28,29,P.sig1,P.ok);
hop(29,31,P.ok,M[11]); hop(31,32,M[11],M[12]); hop(32,33,M[12],P.fact); hold(33,34,P.fact);
const CONTACTS=[1,2,3,6,7,11,12,13,14,16,20,21,22,25,26,27,29,31,32,33];
const L0=34;
// l'envol : vraie parabole jouée au ralenti, la plus lente au sommet, retombe sur « Encore » au temps 46 (= 0)
const APEX=-380, lx0=P.fact[0], ly0=P.fact[1], lx1=M[0][0], ly1=M[0][1];
const vUp=Math.sqrt(2*G*(ly0-APEX)), TF=vUp/G+Math.sqrt(2*(ly1-APEX)/G);
const WARP=(()=>{const n=2000,acc=[0];let s=0;for(let i=1;i<=n;i++){const u=(i-.5)/n;s+=1-0.9*Math.pow(Math.sin(Math.PI*u),0.6);acc.push(s);}return acc.map(v=>v/s);})();
const warp=u=>{const f=clamp(u)*2000,i=Math.floor(f);return i>=2000?1:lerp(WARP[i],WARP[i+1],f-i);};
const APX=[540,430], R1=36.6, F0=NB-Math.sqrt(2*(ly1-APX[1])/G)/B;
function heroAt(b){
  if(b>=L0){
    if(b<R1){const u=easeOut(seg(b,L0,R1));return [lerp(lx0,APX[0],u),lerp(ly0,APX[1],u)];}
    if(b<F0) return [APX[0],APX[1]-Math.sin(Math.PI*seg(b,R1,F0))*26*Math.sin(Math.PI*seg(b,R1,F0)*5)];
    const tt=(b-F0)*B; return [lerp(APX[0],lx1,seg(b,F0,NB)), APX[1]+0.5*G*tt*tt];}
  for(const s of S){ if(b<=s.b){ const u=seg(b,s.a,s.b);
    if(s.type==='hold') return s.p0.slice();
    if(s.type==='roll') return [lerp(s.p0[0],s.p1[0],ease(u)), lerp(s.p0[1],s.p1[1],ease(u))];
    const T=(s.b-s.a)*B, tt=(b-s.a)*B, vy=(s.p1[1]-s.p0[1]-0.5*G*T*T)/T;
    return [lerp(s.p0[0],s.p1[0],u), s.p0[1]+vy*tt+0.5*G*tt*tt]; } }
  return M[0].slice();
}
function heroVel(b){const d=1/240/B,a=heroAt(Math.max(0,b-d)),c=heroAt(Math.min(NB,b+d));return [(c[0]-a[0])*120,(c[1]-a[1])*120];}

// ——— caméra : posée sur la scène en cours, suit la bille pendant les chutes ———
const C=O.map(o=>[o[0]+540,o[1]+640]);
const ORDRE=[[0,4],[1,9],[2,18],[5,23],[3,29],[4,34]];   // scène, temps où la bille la quitte
const camK=(()=>{const kx=[[0,C[0][0]]],ky=[[0,C[0][1]]];for(let i=1;i<ORDRE.length;i++){const[sp,q]=ORDRE[i-1],sc=ORDRE[i][0];
  kx.push([q+0.15,C[sp][0]],[q+1.85,C[sc][0]]);ky.push([q+0.15,C[sp][1]],[q+1.85,C[sc][1]]);}return [kf(kx),kf(ky)];})();
const ANC=camK[0], ANCY=camK[1], POIDS=()=>0.97;
const Z=1.02, VUE={x:890,y:5500,z:0.15};
const BAKE=(()=>{const dt=1/240,n=Math.ceil(L0*B/dt)+2,out=[];let x=C[0][0],y=C[0][1],vx=0,vy=0;const w=11;
  for(let i=0;i<n;i++){const b=Math.min(L0,i*dt/B),h=heroAt(b),v=heroVel(b),k=POIDS(b);
    const tx=lerp(h[0]+v[0]*.12,ANC(b),k), ty=lerp(h[1]+v[1]*.12,ANCY(b),k);
    vx+=(w*w*(tx-x)-2*w*vx)*dt; vy+=(w*w*(ty-y)-2*w*vy)*dt; x+=vx*dt; y+=vy*dt; out.push([x,y]);}
  return out;})();
const suivi=t=>{const f=t*240,i=Math.floor(f),a=BAKE[Math.min(i,BAKE.length-1)],c=BAKE[Math.min(i+1,BAKE.length-1)];return [lerp(a[0],c[0],f-i),lerp(a[1],c[1],f-i)];};
const RECUL=kf([[L0,0],[L0+2.2,1,easeOut]]), PLONGE=kf([[45.4,0],[NB,1]]);
function camera(b){
  const debut={x:C[0][0],y:C[0][1],z:Z};
  if(b<L0){const s=suivi(b*B);return {x:s[0],y:s[1],z:Z};}
  const s=suivi(L0*B), FIN=[540,800];
  if(b<F0){const u=easeOut(seg(b,L0,R1));return {x:lerp(s[0],FIN[0],u),y:lerp(s[1],FIN[1],u),z:Z};}
  const u=ease(seg(b,F0,NB));return {x:lerp(FIN[0],debut.x,u),y:lerp(FIN[1],debut.y,u),z:Z};
}

// ——— états ———
const RESET=42.5;                                   // tout s'éteint sous le carton, avant la plongée
const actif=(b,a)=>b>=a&&b<RESET;
const fmt=v=>v.toFixed(2).replace('.',',')+' €';
const sigPts=(()=>{const r=rng(7),p=[];for(let i=0;i<=60;i++){const u=i/60;p.push([20+u*240,80+Math.sin(u*17)*30*Math.sin(u*Math.PI)+(r()-.5)*6-u*16]);}return p;})();
(()=>{const g=$('halo').getContext('2d'),gr=g.createRadialGradient(200,200,0,200,200,200);gr.addColorStop(0,'rgba(255,170,100,.55)');gr.addColorStop(.35,'rgba(232,101,15,.22)');gr.addColorStop(1,'rgba(232,101,15,0)');g.fillStyle=gr;g.fillRect(0,0,400,400);})();

function seek(T){
  const t=((T%DN)+DN)%DN, b=t/B;
  const c=camera(b), vol2=b>=L0?seg(b,L0,R1)*(1-seg(b,F0-0.8,F0)):0;
  $('world').style.transform=`translate(${540-c.x*c.z}px,${940-c.y*c.z}px) scale(${c.z})`;

  // la bille
  const h=heroAt(b), v=heroVel(b);
  let dc=99;for(const k of CONTACTS){const x=(b-k)*B;if(x>=0&&x<dc)dc=x;} if(b<L0&&t<dc)dc=t; if(b>NB-0.25)dc=0;
  const sq=Math.exp(-dc/0.045)*(dc<0.25?1:0), sp=Math.hypot(v[0],v[1]);
  let sx=1,sy=1; if(sq>0.05){sx=1+0.25*sq;sy=1-0.2*sq;}else if(sp>300){const st=Math.min(0.15,sp/16000);sx=1+st;sy=1-st*.7;}
  const ang=sq>0.05?0:Math.atan2(v[1],v[0])*180/Math.PI, big=1+0.6*vol2;
  $('hero').style.transform=`translate(${h[0]}px,${h[1]+(sq>0.05?R*0.2*sq:0)}px) rotate(${ang}deg) scale(${sx*big},${sy*big}) rotate(${-ang}deg)`;
  $('halo').style.transform=`translate(${h[0]}px,${h[1]}px) scale(${0.6+0.9*vol2})`;
  $('halo').style.opacity=0.5+0.5*vol2;

  // les mots : éteints, puis allumés au moment où la bille s'y pose (orange pour le mot clé)
  MOTS.forEach((m,i)=>{const e=motEl[i],hb=m[4],on=hb===0?b<RESET:actif(b,hb);
    const k=on?(hb===0?1:spring((b-hb)*B,20,.55)):0, coup=on&&b-hb<0.25&&b>=hb?1-(b-hb)/0.25:0;
    e.style.color=on?(m[5]?'var(--oc)':'var(--texte)'):'';
    const debut=DEB[m[0]]; e.style.opacity=b>=L0||m[0]===0?1:clamp((b-(debut-0.8))/0.4);
    e.style.transform=`translateX(-50%) translateY(${coup*10}px) scale(${1+0.06*Math.sin(Math.PI*clamp(k))})`;});

  // 1. le document qui se tape lentement, le curseur qui clignote
  const lent=actif(b,3)?seg(b,3,6):0;
  $('t3').style.width=(200*lent)+'px'; $('curseur').style.left=(40+200*lent)+'px';
  $('curseur').style.opacity=Math.floor(t*3)%2?0.2:1;
  // 2. le micro
  const micOn=actif(b,7);
  $('mRempli').style.opacity=micOn?1:0; $('mAnneau').style.opacity=micOn?0:1;
  $('mRempli').style.transform=`scale(${micOn?0.92+0.08*spring((b-7)*B,18,.5)+0.03*Math.sin(t*20):1})`;
  let bars='';if(micOn&&b<10.5){const a=clamp((b-7)*2)*(1-seg(b,9.5,10.5));for(let i=0;i<24;i++){const x=i<12?20+i*26:694+(i-12)*26;
    const hh=10+a*120*Math.abs(Math.sin(t*9+i*1.7)*Math.sin(t*4.3+i*.6));bars+=`<rect x="${x}" y="${100-hh/2}" width="12" height="${hh}" rx="6" fill="#E8650F" opacity="${.45+.55*a}"/>`;}}
  $('onde').innerHTML=bars;
  // 3. le devis : trois lignes, puis le total
  [14,14.5,15].forEach((a,i)=>document.querySelectorAll('.r'+i).forEach(e=>{const k=actif(b,a)?spring((b-a)*B,16,.62):0;e.style.opacity=clamp(k*1.5);e.style.transform=`scaleX(${0.4+0.6*clamp(k)})`;e.style.transformOrigin=e.style.right?'100% 50%':'0 50%';}));
  let u=0; if(actif(b,16)) u=b<18?seg(heroAt(b)[0],P.p0[0],P.p1[0]):1;
  $('total').textContent=fmt(872.30*ease(u)); $('total').style.opacity=actif(b,16)?1:0; $('total').style.color=u>=1?'var(--oc)':'';
  $('piste').style.width=(620*u)+'px';
  // 4. la signature, puis ✓
  const sg=actif(b,27)?seg(b,27,28):0, n=Math.floor(sg*60);let dp='';for(let i=0;i<=n;i++){const p=sigPts[i];dp+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}
  $('sig').setAttribute('d',n>0?dp:'');
  const ok=actif(b,29);
  $('ok').style.background=ok?'var(--vert)':''; $('ok').style.color=ok?'#fff':''; $('ok').style.borderColor=ok?'var(--vert)':'';
  $('ok').style.transform=`translateY(${b>=29&&b<29.3?8:0}px)`;
  // la voix devient les lignes : départ du micro au moment où la bille le quitte, arrivée dans le devis
  traits.forEach((e,i)=>{const a0=9+i*0.3,f=actif(b,a0)?ease(seg(b,a0,a0+1.9)):0,[lx,ly,lw]=LIGNES[i];
    const x=lerp(MIC[0]-60,lx,f), y=lerp(MIC[1],ly,f)-Math.sin(Math.PI*f)*260, w=lerp(120,lw*0.55,f);
    const fond=actif(b,14+i*0.5)?seg(b,14+i*0.5,14.8+i*0.5):0;
    e.style.width=w+'px'; e.style.opacity=(actif(b,a0)?1:0)*(1-fond); e.style.transform=`translate(${x}px,${y-11}px) rotate(${(1-f)*-25*Math.sin(Math.PI*f)}deg)`;});
  ondes.forEach((e,i)=>{const on=actif(b,7)&&b<9.6, ph=((b-7)*B*1.3+i/3)%1;
    e.style.opacity=on?(1-ph)*0.55*(1-seg(b,9.1,9.6)):0; e.style.transform=`translate(${MIC[0]}px,${MIC[1]}px) scale(${1+1.5*ph})`;});
  parts.forEach(p=>{const dt=(b-p.E.a)*B-p.d, on=actif(b,p.E.a)&&dt>=0&&dt<p.E.dur;
    p.el.style.opacity=on?1-Math.pow(dt/p.E.dur,2):0;
    if(on)p.el.style.transform=`translate(${p.E.x+p.vx*dt}px,${p.E.y+p.vy*dt+0.5*p.E.g*dt*dt}px) rotate(${p.rot*dt}deg)`;});
  {const dt=(b-33)*B,on=actif(b,33)&&dt<0.7;choc.style.opacity=on?0.8*(1-dt/0.7):0;choc.style.transform=`translate(740px,${O[4][1]+1010}px) scale(${1+2.2*easeOut(dt/0.7)})`;}
  // 3b. l'envoi : le bouton s'enfonce, l'avion part vers le client en laissant sa trace, le bouton passe à ✓
  const pr=b>=22&&b<22.3, parti=actif(b,22.15), fv=parti?easeOut(seg(b,22.15,23.6)):0;
  $('envoi').style.transform=`translateY(${pr?10:0}px) scale(${pr?0.97:1})`;
  $('avionBtn').style.opacity=parti?0:1; $('envoiOk').style.opacity=parti?clamp((b-22.3)*4):0;
  const vol=f=>[540+Math.sin(Math.PI*f)*280, 735+f*1330-Math.sin(Math.PI*f)*260], [ax,ay]=vol(fv), q2=vol(Math.min(1,fv+0.01));
  const cap=Math.atan2(q2[1]-ay,q2[0]-ax)*180/Math.PI+45;
  $('avion').style.opacity=parti&&fv<1?1:0;
  $('avion').style.transform=`translate(${ax-50}px,${ay-50}px) rotate(${cap}deg) scale(${1.1-0.3*fv})`;
  let tp='';if(parti){for(let i=0;i<=30;i++){const f=fv*i/30;const q=vol(f);tp+=(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}}
  $('tracePath').setAttribute('d',tp); $('tracePath').style.opacity=parti?0.7*(1-seg(b,24,25)):0;
  // 5. le badge de la facture
  const kb=actif(b,33)?spring((b-33)*B,15,.55):0;
  $('badge').style.opacity=clamp(kb*1.5); $('badge').style.transform=`scale(${0.3+0.7*kb}) rotate(${(1-clamp(kb))*-30}deg)`;

  // la phrase du recul, puis le carton (jamais les deux ensemble)
  const ci=seg(b,37,37.5)*(1-seg(b,41.1,41.4)), kc=b>=37?spring((b-37)*B,14,.7):0;
  $('cap').innerHTML='Ce soir,<br><em>vous êtes libre.</em>';
  $('cap').style.opacity=ci; $('cap').style.transform=`translateY(${(1-kc)*40}px) scale(${0.88+0.12*kc})`;
  const a=41.5, out=1;
  for(let i=0;i<4;i++){const k=b<a?0:spring((b-a)*B-i*0.09,14,.7),e=$('f'+i);e.style.opacity=clamp(k*1.5)*out;e.style.transform=`translateY(${(1-k)*50}px) scale(${0.9+0.1*k})`;}
}
window.seek=seek;

const render=location.search.includes('render');
if(render){$('ui').style.display='none';}
else{const fit=()=>{const k=Math.min(innerWidth/1080,(innerHeight-40)/1920);$('stage').style.transform=`scale(${k})`;};addEventListener('resize',fit);fit();
  let t0=performance.now(),run=false,off=0;$('lecture').onclick=()=>{run=!run;t0=performance.now()-off*1000;};
  $('curseurUI').oninput=e=>{off=e.target.value/1000*DN;t0=performance.now()-off*1000;};
  (function loop(){if(run)off=((performance.now()-t0)/1000)%DN;$('temps').textContent=off.toFixed(2);$('curseurUI').value=off/DN*1000;seek(off);requestAnimationFrame(loop);})();}
seek(0);
</script>
