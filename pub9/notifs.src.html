<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diktéo · 22 h 14</title>
<style>
/*FONTS*/
html,body{margin:0;background:#050505;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#ui{position:absolute;left:0;bottom:0;width:100%;padding:10px;background:#111;color:#ccc;font:14px sans-serif;display:flex;gap:10px;align-items:center;box-sizing:border-box}
#ui input{flex:1}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="lecture">Lecture</button><input id="curseurUI" type="range" min="0" max="1000" value="0"><span id="temps">0.00</span></div>
<script>
/* Pub 9 « 22 h 14, ton téléphone » : l'écran verrouillé de l'artisan, le soir. Les relances tombent toutes les 0,75 s
   et s'empilent jusqu'au message qui fait mal (la cliente part chez un autre). Un geste balaie tout : Diktéo, la vraie
   dictée. Puis le même écran, calme, à 18 h 12 : « Mme Martin a signé votre devis ». 121 BPM, 38 temps (18,8 s). */
const W=1080,H=1920,B=60/121,NB=38,DN=NB*B;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
function spring(t,w=14,z=.62){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const O1='#E8650F',O2='#C9480A',O3='#A8350A',CREME='#F2EEE8';
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function texte(t,x,y,size,col,poids=800,font='Inter',align='center'){g.font=`${poids} ${size}px ${font}`;g.fillStyle=col;g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y);}
// légende façon TikTok : gros texte blanc cerné de noir, en haut
// « TU DICTES » : un badge avec le micro qui pulse, pendant que l'écran montre la dictée
function badgeDicte(b,b0,b1,y){if(b<b0||b>b1+.3)return;const a=clamp((b-b0)*3)*(1-seg(b,b1,b1+.3));g.save();g.globalAlpha=a;g.translate(540,y);
  g.fillStyle='rgba(10,8,6,.88)';rr(-190,-50,380,100,50);g.fill();
  g.globalCompositeOperation='lighter';for(let k=0;k<2;k++){const ph=((b-b0)*1.4+k*.5)%1;g.strokeStyle=`rgba(255,138,61,${.7*(1-ph)})`;g.lineWidth=3;g.beginPath();g.arc(-130,0,34+ph*30,0,7);g.stroke();}
  g.globalCompositeOperation='source-over';const gm=g.createLinearGradient(-160,-30,-100,30);gm.addColorStop(0,O1);gm.addColorStop(1,O3);g.fillStyle=gm;g.beginPath();g.arc(-130,0,34,0,7);g.fill();
  g.fillStyle='#fff';rr(-137,-18,14,26,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(-130,-4,13,.15*Math.PI,.85*Math.PI);g.stroke();
  g.font='900 40px Archivo';g.textAlign='left';g.textBaseline='middle';g.fillStyle=O1;g.fillText('TU DICTES',-80,2);g.restore();}
function legende(lignes,b,b0,b1,y=230,size=74,cols){
  if(b<b0-.1||b>b1+.4)return;
  const k=b0<=b?spring((b-b0)*B,14,.75):0,a=clamp(k*1.6)*(1-seg(b,b1,b1+.4));
  g.save();g.globalAlpha=a;g.lineJoin='round';
  lignes.forEach((l,i)=>{const yy=y+i*size*1.15+(1-k)*24;g.font=`800 ${size}px Inter`;g.textAlign='center';g.textBaseline='middle';
    g.lineWidth=14;g.strokeStyle='rgba(0,0,0,.85)';g.strokeText(l,540,yy);g.fillStyle=(cols&&cols[i])||'#fff';g.fillText(l,540,yy);});
  g.restore();
}

// ——— le fond d'écran : nuit bleue, des lumières floues de camion et de rue, grain fixe ———
function papierPeint(chaud){const c=document.createElement('canvas');c.width=W;c.height=H;const f=c.getContext('2d');
  const gr=f.createLinearGradient(0,0,0,H);
  if(chaud){gr.addColorStop(0,'#2a1a10');gr.addColorStop(.6,'#3b2414');gr.addColorStop(1,'#140c07');}
  else{gr.addColorStop(0,'#0b1020');gr.addColorStop(.6,'#141a30');gr.addColorStop(1,'#07080f');}
  f.fillStyle=gr;f.fillRect(0,0,W,H);
  const lum=chaud?[[220,1400,320,'255,170,90'],[860,1300,260,'255,140,60'],[540,1650,420,'255,190,120']]:[[200,1450,260,'255,150,70'],[880,1380,200,'120,160,255'],[600,1700,300,'255,120,60']];
  for(const [x,y,r,c0] of lum){const l=f.createRadialGradient(x,y,0,x,y,r);l.addColorStop(0,`rgba(${c0},.38)`);l.addColorStop(1,`rgba(${c0},0)`);f.fillStyle=l;f.fillRect(0,0,W,H);}
  const d=f.getImageData(0,0,W,H),p=d.data;let s=chaud?11:7;for(let i=0;i<p.length;i+=4){s=(s*16807)%2147483647;const n=(s/2147483647-.5)*8;p[i]+=n;p[i+1]+=n;p[i+2]+=n;}f.putImageData(d,0,0);return c;}
const NUIT=papierPeint(false),SOIR=papierPeint(true);
// le fond flouté, vu à travers le verre des notifications
function flou(src){const c=document.createElement('canvas');c.width=W;c.height=H;const f=c.getContext('2d');f.filter='blur(46px) saturate(1.4)';f.drawImage(src,0,0);return c;}
const FLOU_NUIT=flou(NUIT),FLOU_SOIR=flou(SOIR);

// ——— les notifications : qui écrit, quoi (rien de réel : noms et entreprises fictifs) ———
const NOTIFS=[
  {app:'msg',qui:'Mme Martin',txt:'Vous avez pu faire le devis ?'},
  {app:'msg',qui:'M. Leroy',txt:'Je relance pour le devis de la salle de bain'},
  {app:'mail',qui:'Bati-Négoce',txt:'Votre facture n° 4821 est disponible'},
  {app:'tel',qui:'Mme Martin',txt:'Appel manqué'},
  {app:'msg',qui:'Agence Rives Immo',txt:'Le devis pour l’appart, c’est pour quand ?'},
  {app:'tel',qui:'M. Leroy',txt:'2 appels manqués'},
  {app:'vm',qui:'Messagerie vocale',txt:'3 nouveaux messages'},
  {app:'msg',qui:'Mme Martin',txt:'Bon, je vais demander à quelqu’un d’autre.',dur:true},
];
const T0=.8, PAS=1.5;     // une notification tous les 1,5 temps (0,75 s)
NOTIFS.forEach((n,i)=>n.b=T0+i*PAS);
const B_DUR=NOTIFS[NOTIFS.length-1].b;         // la dernière, celle qui fait mal
const B_BALAIE=B_DUR+2.4;                       // le geste qui balaie tout

// ——— le vrai écran de Diktéo ———
const ECRANS=[],N_ECR=375;
const charge=Promise.all(Array.from({length:N_ECR},(_,i)=>new Promise(r=>{const im=new Image();im.onload=r;im.onerror=r;im.src=`../pub2/ecran/chauffagiste/ecran_${String(i+1).padStart(4,'0')}.png`;ECRANS.push(im);})));

// les icônes d'apps (dessinées : bulle, combiné, enveloppe, messagerie, Diktéo)
const P_TEL=new Path2D('M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z');
const P_DIK=new Path2D('M6.5 2.5H12a9 9 0 0 1 0 18H9.2L4.5 23V4.5a2 2 0 0 1 2-2ZM9.2 9.5a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1Zm3.1-2.5a1 1 0 0 0-1 1v7a1 1 0 0 0 2 0V8a1 1 0 0 0-1-1Zm3.1 2a1 1 0 0 0-1 1v3a1 1 0 0 0 2 0v-3a1 1 0 0 0-1-1Z');
function icone(app,x,y,sz){
  const gr=g.createLinearGradient(x,y,x,y+sz);
  if(app==='mail'){gr.addColorStop(0,'#3aa0ff');gr.addColorStop(1,'#1066e8');}
  else if(app==='dik'){gr.addColorStop(0,O1);gr.addColorStop(.55,O2);gr.addColorStop(1,O3);}
  else{gr.addColorStop(0,'#62f37c');gr.addColorStop(1,'#14c23a');}
  g.fillStyle=gr;rr(x,y,sz,sz,sz*.225);g.fill();
  const k=sz/24;g.save();g.translate(x,y);g.fillStyle='#fff';g.strokeStyle='#fff';
  if(app==='msg'){g.beginPath();g.ellipse(12*k,11.2*k,7.6*k,6.4*k,0,0,7);g.fill();g.beginPath();g.moveTo(6.2*k,14.4*k);g.lineTo(4.6*k,18.6*k);g.lineTo(9.6*k,16.4*k);g.fill();}
  else if(app==='tel'){g.translate(5*k,5*k);g.scale(k*.6,k*.6);g.fill(P_TEL);}
  else if(app==='mail'){g.fillRect(5*k,7.5*k,14*k,9.5*k);g.lineWidth=1.3*k;g.strokeStyle='#1a72ee';g.beginPath();g.moveTo(5.4*k,8*k);g.lineTo(12*k,13*k);g.lineTo(18.6*k,8*k);g.stroke();}
  else if(app==='vm'){g.lineWidth=1.8*k;g.beginPath();g.arc(8.3*k,12*k,3*k,0,7);g.stroke();g.beginPath();g.arc(15.7*k,12*k,3*k,0,7);g.stroke();g.beginPath();g.moveTo(8.3*k,15*k);g.lineTo(15.7*k,15*k);g.stroke();}
  else if(app==='dik'){g.translate(2.6*k,1.6*k);g.scale(k*.8,k*.8);g.fill(P_DIK,'evenodd');}
  g.restore();
}
// une notification d'écran verrouillé : verre dépoli (le fond flouté se voit à travers), icône, nom, heure, message
function carte(n,x,y,w,a,s=1,fl=FLOU_NUIT){
  const h=152;g.save();g.globalAlpha=a;
  const m=g.getTransform();
  g.translate(x,y);g.scale(s,s);
  g.save();rr(-w/2,-h/2,w,h,46);g.clip();
  g.setTransform(m);g.drawImage(fl,0,0);           // le fond flou, à sa place
  g.restore();
  g.fillStyle='rgba(255,255,255,.17)';rr(-w/2,-h/2,w,h,46);g.fill();
  g.strokeStyle='rgba(255,255,255,.10)';g.lineWidth=1.5;rr(-w/2,-h/2,w,h,46);g.stroke();
  icone(n.app,-w/2+26,-h/2+38,76);
  texte(n.qui,-w/2+124,-h/2+52,34,'#fff',600,'Inter','left');
  texte('maintenant',w/2-30,-h/2+52,28,'rgba(255,255,255,.62)',400,'Inter','right');
  let t=n.txt;g.font='400 33px Inter';while(g.measureText(t).width>w-160&&t.length>4)t=t.slice(0,-2);if(t!==n.txt)t=t.trim()+'…';
  texte(t,-w/2+124,-h/2+100,33,'rgba(255,255,255,.94)',400,'Inter','left');
  g.restore();
}
// l'écran verrouillé : cadenas, date, heure, lampe et appareil photo, la barre du bas
function verrou(h,b){
  g.save();g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=5;g.beginPath();g.arc(540,128,15,Math.PI,0);g.stroke();rr(518,128,44,34,8);g.fill();g.restore();
  texte('mardi 11 novembre',540,300,42,'rgba(255,255,255,.88)',600,'Inter');
  texte(h,540,450,250,'#fff',600,'Inter');
  for(const [x,glyphe] of [[160,'lampe'],[920,'photo']]){
    g.save();g.fillStyle='rgba(255,255,255,.16)';g.beginPath();g.arc(x,1740,62,0,7);g.fill();g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=4;
    if(glyphe==='lampe'){rr(x-12,1716,24,20,4);g.fill();rr(x-8,1738,16,30,5);g.stroke();}
    else{rr(x-26,1725,52,36,8);g.stroke();g.beginPath();g.arc(x,1743,10,0,7);g.stroke();rr(x-10,1717,20,10,3);g.fill();}
    g.restore();}
  g.fillStyle='rgba(255,255,255,.85)';rr(400,1880,280,10,5);g.fill();
}
function seek(T){
  const t=((T%DN)+DN)%DN,b=t/B;
  g.setTransform(1,0,0,1,0,0);
  const fin=b>=25.6;
  g.drawImage(fin?SOIR:NUIT,0,0);
  // la vibration du téléphone à chaque notification
  let sx=0;for(const n of NOTIFS){const d=(b-n.b)*B;if(d>0&&d<.35)sx+=Math.sin(d*170)*(n.dur?16:8)*(1-d/.35);}
  g.translate(sx,0);

  // 1 · l'écran verrouillé, la nuit
  if(b<B_BALAIE+1.2){
    const bal=easeOut(seg(b,B_BALAIE,B_BALAIE+1.1));     // le geste vers le haut
    g.save();g.translate(0,-bal*1900);g.globalAlpha=1-bal*.6;
    verrou('22:14',b);
    // les notifications : la dernière en haut de la pile, les anciennes descendent et se tassent
    const vis=NOTIFS.filter(n=>b>=n.b-.02);
    vis.slice().reverse().forEach((n,j)=>{
      const k=spring((b-n.b)*B,16,.7),entre=clamp(k);
      const y0=700+j*166-(1-entre)*120, s=lerp(.9,1,entre)*(j>4?lerp(1,.94,clamp((j-4)/3)):1);
      const a=clamp(entre*1.4)*(j>5?.7:1);
      if(j>(b>=B_DUR+.5?4:5))return;carte(n,540,y0,980,a,s);
    });
    // la dernière fait mal : l'écran rougit un instant
    if(b>=B_DUR&&b<B_BALAIE){const a=.22*Math.exp(-(b-B_DUR)*1.2);g.fillStyle=`rgba(200,30,20,${a})`;g.fillRect(-40,0,W+80,H);}
    g.restore();
  }
  legende(['POV : t’es artisan,','il est 22 h 14.'],b,0,3.6,1300,76,['#fff',O1]);
  legende(['Elle est partie','chez un autre.'],b,B_DUR+.6,B_BALAIE-.1,1545,70,['#fff','#ff8a70']);
  // la trace du doigt qui balaie
  if(b>=B_BALAIE-.2&&b<B_BALAIE+1){const u=seg(b,B_BALAIE-.2,B_BALAIE+.9),y=lerp(1650,700,easeOut(u));g.save();g.globalAlpha=Math.sin(u*Math.PI)*.85;
    const gr=g.createRadialGradient(540,y,0,540,y,70);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(540,y,70,0,7);g.fill();g.restore();}

  // 2 · Diktéo s'ouvre en plein écran, comme une vraie app qu'on lance
  const bA=B_BALAIE+.6, bF=25.6;
  if(b>=bA&&b<bF+.8){
    const o=easeOut(seg(b,bA,bA+1)),f=ease(seg(b,bF-.4,bF+.6));
    const sc=lerp(.12,1,o), cy=lerp(1500,960,o), rad=lerp(120,0,o);
    g.save();g.globalAlpha=clamp(o*2)*(1-f);g.translate(540,cy);g.scale(sc,sc);
    g.save();rr(-540,-960,1080,1920,rad/sc);g.clip();
    g.fillStyle='#0f1412';g.fillRect(-540,-960,1080,1920);
    const fr=Math.round(clamp((b-(bA+.8))/(bF-.6-(bA+.8)))*(N_ECR-1)),im=ECRANS[fr];
    if(im&&im.complete)g.drawImage(im,-450,-960,900,1920);
    g.restore();g.restore();
  }
  legende(['Tu dictes ton devis,','il s’écrit tout seul.'],b,bA+.8,bA+4.6,1080,72,['#fff',O1]);
  badgeDicte(b,bA+1,bA+.8+(bF-1.4-bA)*.42,1450);

  // 3 · le même écran, calme, en fin d'après-midi
  if(b>=bF){
    const k=easeOut(seg(b,bF,bF+.8));g.save();g.globalAlpha=k;
    verrou('18:12',b);
    const kn=spring((b-(bF+.7))*B,15,.7);
    if(b>=bF+.7)carte({app:'dik',qui:'Diktéo',txt:'Mme Martin a signé votre devis · 886,60 €'},540,700-(1-clamp(kn))*120,980,clamp(kn*1.4),lerp(.9,1,clamp(kn)),FLOU_SOIR);
    g.restore();
  }
  legende(['Le client signe.','Toi, t’es rentré.'],b,bF+1.4,bF+5.2,1060,76,['#fff',O1]);
  // 4 · le carton
  if(b>=bF+5.6){
    const k=spring((b-(bF+5.6))*B,12,.8);g.save();g.globalAlpha=clamp(k*1.5);
    g.fillStyle='rgba(8,6,5,.95)';g.fillRect(-40,0,W+80,H);
    g.translate(0,(1-k)*36);
    const tx=540-260,ty=700;const gr=g.createLinearGradient(tx,ty,tx+140,ty+140);gr.addColorStop(0,O1);gr.addColorStop(.55,O2);gr.addColorStop(1,O3);
    g.fillStyle=gr;rr(tx,ty,140,140,40);g.fill();
    g.save();g.translate(tx+18,ty+16);g.scale(4.4,4.4);g.fillStyle='#fff';g.fill(new Path2D('M6.5 2.5H12a9 9 0 0 1 0 18H9.2L4.5 23V4.5a2 2 0 0 1 2-2ZM9.2 9.5a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1Zm3.1-2.5a1 1 0 0 0-1 1v7a1 1 0 0 0 2 0V8a1 1 0 0 0-1-1Zm3.1 2a1 1 0 0 0-1 1v3a1 1 0 0 0 2 0v-3a1 1 0 0 0-1-1Z'),'evenodd');g.restore();
    texte('Diktéo',tx+170,ty+72,138,CREME,900,'Archivo','left');
    texte('Tu dictes ton devis, Diktéo l’écrit.',540,905,46,CREME,700);texte('3 devis offerts par mois',540,1010,64,CREME,700);texte('sans carte bancaire',540,1090,46,'#B9AFA1',600,'Inter');
    const gb=g.createLinearGradient(290,1180,790,1280);gb.addColorStop(0,O1);gb.addColorStop(.55,O2);gb.addColorStop(1,O3);g.fillStyle=gb;rr(270,1180,540,104,34);g.fill();
    texte('dikteo.vercel.app',540,1233,46,'#fff',800,'Inter');
    g.restore();
  }
}
window.seek=seek;
const render=location.search.includes('render');
if(render){document.getElementById('ui').style.display='none';}
else{const fit=()=>{const k=Math.min(innerWidth/1080,(innerHeight-40)/1920);cv.style.transform=`scale(${k})`;};addEventListener('resize',fit);fit();
  let t0=performance.now(),run=false,off=0;document.getElementById('lecture').onclick=()=>{run=!run;t0=performance.now()-off*1000;};
  document.getElementById('curseurUI').oninput=e=>{off=e.target.value/1000*DN;t0=performance.now()-off*1000;};
  (function loop(){if(run)off=((performance.now()-t0)/1000)%DN;document.getElementById('temps').textContent=off.toFixed(2);document.getElementById('curseurUI').value=off/DN*1000;seek(off);requestAnimationFrame(loop);})();}
Promise.all([charge,document.fonts.ready]).then(()=>{seek(0);window.VIDEO={w:W,h:H,duration:DN};});
</script>
</body>
</html>
