<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diktéo · la voix devient le devis</title>
<style>
/*FONTS*/
:root{ --texte:#EDE6DA; --fond:#17110C; --encre:#15201B; --doux:#6B776F; --trait:#DCD6CB; --o1:#E8650F; --o2:#C9480A; --o3:#A8350A; --o:#C9480A; }
html,body{margin:0;background:#050807;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--fond);overflow:hidden;transform-origin:0 0}
#papier{position:absolute;inset:0}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 1000px}
.ph{position:absolute;left:70px;top:330px;width:940px;text-align:center;font-family:'Archivo';font-weight:800;font-size:80px;line-height:1.12;letter-spacing:-2.2px;color:var(--texte)}
.ph .c{display:block}
.ph .w{display:inline-block;white-space:nowrap}
.vol{position:absolute;left:0;top:0;white-space:nowrap;font-family:'Archivo';font-weight:800;font-size:80px;line-height:1.12;letter-spacing:-2.2px;color:var(--texte);transform-origin:0 0;pointer-events:none}
#micro{position:absolute;left:504px;top:200px;width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#E8650F 0%,#C9480A 55%,#A8350A 100%)}
#micro svg{position:absolute;left:21px;top:16px}
#onde{position:absolute;left:340px;top:286px}
#feuille{position:absolute;left:80px;top:900px;width:920px;height:900px;border-radius:22px;background:#E9E1D2;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.7),0 14px 28px -10px rgba(0,0,0,.5);transform-origin:50% 0;overflow:hidden}
#feuille .tete{position:absolute;left:56px;right:56px;top:46px;height:120px}
.titre{position:absolute;left:0;top:0;font-family:'Archivo';font-weight:800;font-size:40px;letter-spacing:-.8px;color:var(--encre);white-space:nowrap}
.client{position:absolute;left:0;top:54px;font-family:'PublicSans';font-size:26px;color:var(--doux);white-space:nowrap}
.num{position:absolute;right:0;top:8px;font-family:'JBMono';font-weight:700;font-size:24px;color:var(--doux)}
.ligne{position:absolute;left:56px;right:56px;height:118px}
.ligne .d{position:absolute;left:0;top:14px;font-family:'PublicSans';font-weight:700;font-size:30px;color:var(--encre);white-space:nowrap}
.ligne .q{position:absolute;left:0;top:60px;font-family:'JBMono';font-size:23px;color:var(--doux);white-space:nowrap}
.ligne .m{position:absolute;right:0;top:14px;font-family:'JBMono';font-weight:800;font-size:31px;color:var(--encre);white-space:nowrap}
.ligne .sep{position:absolute;left:0;right:0;bottom:0;height:2px;background:#D8CFBE}
#tot{position:absolute;left:56px;right:56px;top:720px;height:120px;border-radius:18px;background:#DFD5C3}
#tot .l{position:absolute;left:28px;top:40px;font-family:'PublicSans';font-weight:600;font-size:28px;color:var(--doux)}
#tot .v{position:absolute;right:28px;top:22px;font-family:'JBMono';font-weight:800;font-size:58px;color:var(--o);white-space:nowrap}
#avion{position:absolute;left:0;top:0;pointer-events:none}
#trace{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#tag{position:absolute;left:60px;top:760px;width:960px;text-align:center;font-family:'Archivo';font-weight:800;font-size:104px;line-height:1.05;letter-spacing:-3px;color:var(--texte)}
#tag em{font-style:normal;color:var(--o)}
#fin{position:absolute;left:90px;top:700px;width:900px;height:520px}
#fin .f{position:absolute;white-space:nowrap}
#ui{position:absolute;left:0;bottom:0;width:100%;padding:10px;background:#111;color:#ccc;font:14px sans-serif;display:flex;gap:10px;align-items:center;box-sizing:border-box}
#ui input{flex:1}
</style>
</head>
<body>
<div id="stage">
 <canvas id="papier" width="1080" height="1920"></canvas>
 <div id="cam">
  <div id="micro"><svg width="30" height="40" viewBox="0 0 44 56"><rect x="13" y="2" width="18" height="32" rx="9" fill="#fff"/><path d="M5 26a17 17 0 0 0 34 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M22 44v9" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></div>
  <svg id="onde" width="400" height="40"></svg>
  <div id="phrases"></div>
  <div id="feuille">
   <div class="tete"><div class="titre">Devis</div><div class="client">Mme Fontaine · Villeurbanne</div><div class="num">D-2026-0042</div></div>
   <div id="lignes"></div>
   <div id="tot"><div class="l">Total TTC</div><div class="v" id="totv">0,00 €</div></div>
  </div>
  <div id="vols"></div>
  <svg id="trace" width="1080" height="1920"><path id="traceP" d="" fill="none" stroke="#C9480A" stroke-width="5" stroke-dasharray="3 18" stroke-linecap="round"/></svg>
  <svg id="avion" width="180" height="180" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-6.5 18-3.2-7.3L3 11.5Z" fill="#E9E1D2" stroke="#8A7F6C" stroke-width=".5" stroke-linejoin="round"/><path d="m11.3 13.7 4-4.2" stroke="#8A7F6C" stroke-width="1" stroke-linecap="round"/></svg>
 </div>
 <div id="tag">Vous parlez.<br><em>Diktéo écrit.</em></div>
 <div id="fin">
  <div class="f" id="f0" style="left:150px;top:0;width:130px;height:130px;border-radius:36px;background:linear-gradient(145deg,var(--o1),var(--o2) 55%,var(--o3))">
   <svg style="position:absolute;left:25px;top:25px" width="80" height="80" viewBox="0 0 24 24"><path d="M6.5 2.5H12a9 9 0 0 1 0 18H9.2L4.5 23V4.5a2 2 0 0 1 2-2ZM9.2 9.5a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1Zm3.1-2.5a1 1 0 0 0-1 1v7a1 1 0 0 0 2 0V8a1 1 0 0 0-1-1Zm3.1 2a1 1 0 0 0-1 1v3a1 1 0 0 0 2 0v-3a1 1 0 0 0-1-1Z" fill="#fff" fill-rule="evenodd"/></svg></div>
  <div class="f" id="f1" style="left:310px;top:-8px;font-family:'Archivo';font-weight:850;font-size:132px;letter-spacing:-5px;color:var(--texte)">Diktéo</div>
  <div class="f" id="f2" style="left:0;width:900px;text-align:center;top:178px;font-family:'Archivo';font-weight:800;font-size:62px;letter-spacing:-1.5px;line-height:1.1;color:var(--texte)">Le devis dicté,<br><span style="color:var(--o)">envoyé du chantier.</span></div>
  <div class="f" id="f3" style="left:210px;width:480px;top:368px;height:96px;border-radius:28px;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(145deg,var(--o1),var(--o2) 55%,var(--o3));font-family:'PublicSans';font-weight:800;font-size:40px;color:#fff">dikteo.vercel.app</div>
 </div>
</div>
<div id="ui"><button id="lecture">Lecture</button><input id="curseurUI" type="range" min="0" max="1000" value="0"><span id="temps">0.00</span></div>
<script>
/* Pub 6, « la voix devient le devis ». Fond papier, caméra calme. 123 BPM (1 temps = 0,488 s), 44 temps = 21,5 s.
   Une seule chose à lire : la phrase dite (en haut), puis ses morceaux glissent seuls dans leur case de la feuille.
  0→3     « Chauffe-eau 200 litres, 520 euros. » (mots un à un)       3.4→5   ils se rangent : ligne 1
  5.5→8   « Groupe de sécurité, 48 euros. »                            8.3→9.8 ligne 2
  10.2→12.6 « Dépose de l'ancien ballon, 60 euros. »                   12.9→14.4 ligne 3
  14.8→17.4 « Main-d'œuvre, 3 heures à 55 euros. »                     17.7→19.4 ligne 4
  20→22.5 le total monte à 872,30 €          23→26.5 la feuille se plie, l'avion part
  27→32   « Vous parlez. Diktéo écrit. »     32.5→44 carton */
function spring(t,w=14,z=.82){if(t<=0)return 0;if(z>=1)return 1-Math.exp(-w*t)*(1+w*t);const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rng=s=>()=>(s=(s+0x6D2B79F5)|0,s=Math.imul(s^(s>>>15),1|s),s^=s+Math.imul(s^(s>>>7),61|s),((s^(s>>>14))>>>0)/4294967296);
const $=id=>document.getElementById(id);
const B=60/123, NB=44, DN=NB*B;
window.VIDEO={w:1080,h:1920,duration:DN};

// ——— le papier : grain fin et lumière douce de fenêtre (dessiné une fois) ———
(()=>{const g=$('papier').getContext('2d');g.fillStyle='#17110C';g.fillRect(0,0,1080,1920);
  const r=rng(3);
  for(let k=0;k<140;k++){const y0=r()*1920, a=4+r()*18, f=0.002+r()*0.004, ph=r()*6, c=r()<0.5?'rgba(70,48,30,':'rgba(8,5,3,';
    g.strokeStyle=c+(0.10+r()*0.18)+')';g.lineWidth=1+r()*3;g.beginPath();for(let x=-20;x<=1100;x+=20){const y=y0+Math.sin(x*f+ph)*a+Math.sin(x*f*3.1+ph)*a*0.3;x<0?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();}
  const l=g.createRadialGradient(540,1250,0,540,1250,1100);l.addColorStop(0,'rgba(255,176,96,.30)');l.addColorStop(.45,'rgba(200,110,40,.12)');l.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=l;g.fillRect(0,0,1080,1920);
  const v=g.createRadialGradient(540,1100,500,540,1100,1400);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=v;g.fillRect(0,0,1080,1920);
  const img=g.getImageData(0,0,1080,1920),d=img.data;for(let i=0;i<d.length;i+=4){const n=(r()-.5)*6;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}g.putImageData(img,0,0);})();

// ——— les quatre phrases et les lignes qu'elles deviennent ———
const P=[
  {a:0,  fly:3.4, mots:[["Chauffe-eau 200 litres,","d"],["520 euros.","m"]], d:"Chauffe-eau électrique 200 L", q:"1 pièce × 520,00 €", m:52000},
  {a:5.5,fly:8.3, mots:[["Groupe de sécurité,","d"],["48 euros.","m"]], d:"Groupe de sécurité et raccords", q:"1 pièce × 48,00 €", m:4800},
  {a:10.2,fly:12.9,mots:[["Dépose du vieux ballon,","d"],["60 euros.","m"]], d:"Dépose de l'ancien ballon", q:"1 forfait × 60,00 €", m:6000},
  {a:14.8,fly:17.7,mots:[["Main-d'œuvre,","d"],["3 heures","q"],["à 55 euros.","m"]], d:"Main-d'œuvre", q:"3 heures × 55,00 €", m:16500}];
const DUREE_DIT=2.4, VOL=1.3, ECART=0.45;
const fmtE=c=>(c/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/ | /g,' ')+' €';
const TTC=Math.round(P.reduce((s,p)=>s+p.m,0)*1.1);   // 87 230 centimes
P.forEach((p,i)=>{
  const ph=document.createElement('div');ph.className='ph';$('phrases').appendChild(ph);
  p.ph=ph; p.words=[]; p.chunks=p.mots.map(([txt,cible])=>{const c=document.createElement('span');c.className='c';
    txt.split(' ').forEach((w,k,arr)=>{const s=document.createElement('span');s.className='w';s.textContent=w;c.appendChild(s);p.words.push(s);if(k<arr.length-1)c.appendChild(document.createTextNode(' '));});
    ph.appendChild(c);ph.appendChild(document.createTextNode(' '));return {c,cible,txt};});
  const l=document.createElement('div');l.className='ligne';l.style.top=(190+i*128)+'px';
  l.innerHTML=`<div class="d">${p.d}</div><div class="q">${p.q}</div><div class="m">${fmtE(p.m)}</div><div class="sep"></div>`;$('lignes').appendChild(l);
  p.ligne=l; p.cells={d:l.querySelector('.d'),q:l.querySelector('.q'),m:l.querySelector('.m')};
});
// position d'un élément dans la caméra (somme des décalages, insensible à l'échelle de l'aperçu)
const pos=el=>{let x=0,y=0,e=el;while(e&&e!==$('cam')){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}return [x,y];};
let VOLS=null;
function prepare(){ if(VOLS&&VOLS.police) return; const police=document.fonts.check("800 80px Archivo")&&document.fonts.check("800 31px JBMono"); VOLS=[]; $('vols').innerHTML=''; P.forEach(p=>p.ph.style.display='block'); $('feuille').style.transform='';
  P.forEach(p=>p.chunks.forEach(ch=>{const v=document.createElement('div');v.className='vol';v.textContent=ch.txt.replace(/[,.]$/,'');$('vols').appendChild(v);
    const cell=p.cells[ch.cible], from=pos(ch.c.firstChild), to=pos(cell);
    const k=parseFloat(getComputedStyle(cell).fontSize)/80;
    // la case est alignée à droite pour les montants : l'arrivée vise son bord droit
    const wTo=v.offsetWidth*k, toX=ch.cible==='m'?to[0]+cell.offsetWidth-wTo:to[0];
    VOLS.push({p,ch,v,from,to:[toX,to[1]-6],k});})); VOLS.police=police;}

// ——— l'avion ———
const ORIG=[540,1350];
const vol=f=>[ORIG[0]+f*700-Math.sin(Math.PI*f)*260, ORIG[1]-f*1700+Math.sin(Math.PI*f)*120];

function seek(T){
  prepare();
  const t=((T%DN)+DN)%DN, b=t/B;
  // caméra calme : elle avance doucement vers la feuille, puis recule pour la fin
  const z=1+0.05*ease(seg(b,0,20))-0.05*ease(seg(b,22,26)), dy=-30*ease(seg(b,0,20))+30*ease(seg(b,22,26));
  $('cam').style.transform=`translateY(${dy}px) scale(${z})`;

  // le micro et la voix
  const parle=P.find(p=>b>=p.a&&b<p.a+DUREE_DIT+0.3);
  $('micro').style.opacity=b<26.5?1-seg(b,23,24):0; $('micro').style.transform=`scale(${parle?1.06:1})`;
  let bars='';if(parle){const a=seg(b,parle.a,parle.a+0.3)*(1-seg(b,parle.a+DUREE_DIT,parle.a+DUREE_DIT+0.3));
    for(let i=0;i<30;i++){const h=4+a*30*Math.abs(Math.sin(t*8+i*1.9)*Math.sin(t*3.7+i*.7));bars+=`<rect x="${i*13+6}" y="${20-h/2}" width="6" height="${h}" rx="3" fill="#C9480A"/>`;}}
  $('onde').innerHTML=bars;

  // les phrases : mots un à un, puis chaque morceau glisse dans sa case
  P.forEach(p=>{
    const n=p.words.length; p.words.forEach((w,i)=>{const a=p.a+i*DUREE_DIT/n, k=b>=a?spring((b-a)*B,16,.75):0;
      w.style.opacity=clamp(k*1.4); w.style.transform=`translateY(${(1-k)*26}px)`;});
    p.ph.style.display=b>=p.a-0.1&&b<p.fly+VOL+ECART*p.chunks.length+0.2?'block':'none';
    p.chunks.forEach((ch,ci)=>{ch.c.style.opacity=b>=p.fly+(p.chunks.length-1-ci)*ECART?0:1;});
  });
  VOLS.forEach((V,j)=>{const p=V.p, a=p.fly+j%3*0, d=(p.chunks.length-1-p.chunks.indexOf(V.ch))*ECART, u=seg(b,p.fly+d,p.fly+d+VOL), e=ease(u);
    const on=b>=p.fly+d&&u<1;
    const x=lerp(V.from[0],V.to[0],e), y=lerp(V.from[1],V.to[1],e)-Math.sin(Math.PI*e)*40, s=lerp(1,V.k,easeOut(u*1.3));
    V.v.style.opacity=b>=p.fly+d&&u<1?1:0; V.v.style.transform=`translate(${x}px,${y}px) scale(${s})`;
    const fin=V.ch.cible==='m'?[201,72,10]:[21,32,27], c0=[237,230,218], cu=easeOut(seg(u,0.35,0.85)); V.v.style.color=`rgb(${lerp(c0[0],fin[0],cu)},${lerp(c0[1],fin[1],cu)},${lerp(c0[2],fin[2],cu)})`;
    const arrive=b>=p.fly+d+VOL*0.92; V.ch._ok=arrive;});
  // les cases se remplissent à l'arrivée des mots ; la quantité vient avec le prix sauf si elle est dite
  P.forEach(p=>{const ok=c=>p.chunks.find(x=>x.cible===c)?._ok;
    const dOk=ok('d'), mOk=ok('m'), qOk=p.chunks.some(x=>x.cible==='q')?ok('q'):mOk;
    p.cells.d.style.opacity=dOk?1:0; p.cells.m.style.opacity=mOk?1:0; p.cells.q.style.opacity=qOk?1:0;
    p.ligne.querySelector('.sep').style.opacity=dOk?1:0;
    const m=p.cells.m; m.style.color=mOk&&b<p.fly+VOL+1.2?'#C9480A':''; });
  // le total
  const u=ease(seg(b,20,22.5)); $('totv').textContent=fmtE(u>=1?TTC:Math.round(TTC*u/10)*10);
  $('tot').style.opacity=seg(b,19.6,20.1);

  // la feuille se plie en deux puis en avion, qui part chez le client
  const pli=seg(b,23,24.6), part=b>=24.6;
  $('feuille').style.transform=`perspective(2400px) rotateX(${ease(pli)*88}deg) scale(${1-0.35*ease(pli)})`;
  $('feuille').style.opacity=pli<1?1:0;
  const fv=part?easeOut(seg(b,24.6,26.6)):0,[ax,ay]=vol(fv),q=vol(Math.min(1,fv+0.01));
  $('avion').style.opacity=b>=24.3&&fv<0.99?seg(b,24.3,24.7):0;
  $('avion').style.transform=`translate(${ax-90}px,${ay-90}px) rotate(${Math.atan2(q[1]-ay,q[0]-ax)*180/Math.PI+45}deg) scale(${lerp(0.6,1,seg(b,24.3,24.8))-0.45*fv})`;
  let tp='';if(part){for(let i=0;i<=40;i++){const pp=vol(fv*i/40);tp+=(i?'L':'M')+pp[0].toFixed(1)+' '+pp[1].toFixed(1);}}
  $('traceP').setAttribute('d',tp); $('traceP').style.opacity=part?0.8*(1-seg(b,26.4,27.4)):0;

  // la phrase de fin, puis le carton (jamais ensemble)
  const kt=b>=27?spring((b-27)*B,12,.8):0; $('tag').style.opacity=clamp(kt*1.5)*(1-seg(b,31.6,32.1)); $('tag').style.transform=`translateY(${(1-kt)*30}px)`;
  for(let i=0;i<4;i++){const k=b<32.5?0:spring((b-32.5)*B-i*0.1,12,.8),e=$('f'+i);e.style.opacity=clamp(k*1.5);e.style.transform=`translateY(${(1-k)*40}px)`;}
}
window.seek=seek;

const render=location.search.includes('render');
if(render){$('ui').style.display='none';}
else{const fit=()=>{const k=Math.min(innerWidth/1080,(innerHeight-40)/1920);$('stage').style.transform=`scale(${k})`;};addEventListener('resize',fit);fit();
  let t0=performance.now(),run=false,off=0;$('lecture').onclick=()=>{run=!run;t0=performance.now()-off*1000;};
  $('curseurUI').oninput=e=>{off=e.target.value/1000*DN;t0=performance.now()-off*1000;};
  (function loop(){if(run)off=((performance.now()-t0)/1000)%DN;$('temps').textContent=off.toFixed(2);$('curseurUI').value=off/DN*1000;seek(off);requestAnimationFrame(loop);})();}
document.fonts.addEventListener('loadingdone',()=>{VOLS=null;});
document.fonts.ready.then(()=>{VOLS=null;seek(0);});
seek(0);
</script>
</body>
</html>
